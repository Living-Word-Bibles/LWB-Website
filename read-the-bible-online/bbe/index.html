<style>

<script>
(() => {
  const root = document.getElementById('lwb-bbe-app');
  if (!root) return;

  /* ---------- Config ---------- */
  const KEY   = (root.dataset.key || 'bbe').toLowerCase();
  const START = root.dataset.passage || root.dataset.start || 'Genesis 1:1';
  const LOGO  = root.dataset.logo || '/assets/LivingWordBibles01.png';
  const API   = 'https://bible-api.com/data/bbe'; // chapter-level, CORS enabled

  // Canon + simple chapter counts (sparse; we detect live and cache per chapter)
  const BOOKS = [
    'Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel',
    '1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs',
    'Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos',
    'Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi',
    'Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians',
    'Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews',
    'James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'
  ];
  const BOOK_ID = {
    'Genesis':'GEN','Exodus':'EXO','Leviticus':'LEV','Numbers':'NUM','Deuteronomy':'DEU','Joshua':'JOS','Judges':'JDG','Ruth':'RUT',
    '1 Samuel':'1SA','2 Samuel':'2SA','1 Kings':'1KI','2 Kings':'2KI','1 Chronicles':'1CH','2 Chronicles':'2CH','Ezra':'EZR','Nehemiah':'NEH','Esther':'EST',
    'Job':'JOB','Psalms':'PSA','Proverbs':'PRO','Ecclesiastes':'ECC','Song of Solomon':'SNG','Isaiah':'ISA','Jeremiah':'JER','Lamentations':'LAM','Ezekiel':'EZK','Daniel':'DAN',
    'Hosea':'HOS','Joel':'JOL','Amos':'AMO','Obadiah':'OBA','Jonah':'JON','Micah':'MIC','Nahum':'NAM','Habakkuk':'HAB','Zephaniah':'ZEP','Haggai':'HAG','Zechariah':'ZEC','Malachi':'MAL',
    'Matthew':'MAT','Mark':'MRK','Luke':'LUK','John':'JHN','Acts':'ACT','Romans':'ROM','1 Corinthians':'1CO','2 Corinthians':'2CO','Galatians':'GAL','Ephesians':'EPH',
    'Philippians':'PHP','Colossians':'COL','1 Thessalonians':'1TH','2 Thessalonians':'2TH','1 Timothy':'1TI','2 Timothy':'2TI','Titus':'TIT','Philemon':'PHM','Hebrews':'HEB',
    'James':'JAS','1 Peter':'1PE','2 Peter':'2PE','1 John':'1JN','2 John':'2JN','3 John':'3JN','Jude':'JUD','Revelation':'REV'
  };
  const ALIAS = {
    gen:'Genesis', ge:'Genesis', ex:'Exodus', lev:'Leviticus', num:'Numbers', deut:'Deuteronomy',
    jos:'Joshua', josh:'Joshua', jdg:'Judges', judg:'Judges', ru:'Ruth',
    '1sa':'1 Samuel','2sa':'2 Samuel','1sam':'1 Samuel','2sam':'2 Samuel',
    '1ki':'1 Kings','2ki':'2 Kings','1kgs':'1 Kings','2kgs':'2 Kings',
    '1ch':'1 Chronicles','2ch':'2 Chronicles','neh':'Nehemiah','est':'Esther','job':'Job',
    ps:'Psalms', psa:'Psalms', psalm:'Psalms', psalms:'Psalms',
    prov:'Proverbs', pr:'Proverbs',
    eccl:'Ecclesiastes', ecc:'Ecclesiastes',
    song:'Song of Solomon', sos:'Song of Solomon', cant:'Song of Solomon', 'song of songs':'Song of Solomon', canticles:'Song of Solomon',
    isa:'Isaiah', jer:'Jeremiah', lam:'Lamentations', ezek:'Ezekiel', eze:'Ezekiel', dan:'Daniel',
    hos:'Hosea', jl:'Joel', joe:'Joel', am:'Amos', ob:'Obadiah', jon:'Jonah', mic:'Micah', nah:'Nahum', hab:'Habakkuk',
    zeph:'Zephaniah', zep:'Zephaniah', hag:'Haggai', zec:'Zechariah', zech:'Zechariah', mal:'Malachi',
    mt:'Matthew', mk:'Mark', mrk:'Mark', lk:'Luke', jn:'John', joh:'John', act:'Acts',
    rom:'Romans', ro:'Romans', '1cor':'1 Corinthians','2cor':'2 Corinthians', gal:'Galatians', eph:'Ephesians',
    phil:'Philippians', php:'Philippians', col:'Colossians', '1th':'1 Thessalonians','2th':'2 Thessalonians',
    '1tim':'1 Timothy','2tim':'2 Timothy', tit:'Titus', phm:'Philemon', heb:'Hebrews',
    jas:'James', jam:'James', '1pet':'1 Peter','2pet':'2 Peter','1jn':'1 John','2jn':'2 John','3jn':'3 John',
    jud:'Jude', rev:'Revelation', apocalypse:'Revelation'
  };

  /* ---------- UI skeleton ---------- */
  root.innerHTML = `
    <div class="lwb-bbe__head">
      <img class="lwb-bbe__logo" alt="Living Word Bibles" src="${LOGO}">
      <div class="lwb-bbe__title">The Holy Bible</div>
      <div class="lwb-bbe__sub">Bible in Basic English</div>
    </div>

    <div class="lwb-bbe__toolbar" aria-label="Controls">
      <input id="bbeInput" class="lwb-bbe__input" type="text" placeholder="Search or jump (e.g., Ps 23, John 3:16, Song 2:1)" />
      <button id="bbeGo" class="lwb-bbe__btn" title="Go">Go</button>

      <select id="bookSel" class="lwb-bbe__select" aria-label="Book"></select>
      <select id="chapSel" class="lwb-bbe__select" aria-label="Chapter"></select>
      <select id="verseSel" class="lwb-bbe__select" aria-label="Verse"></select>

      <button id="diceBtn" class="lwb-bbe__btn lwb-bbe__dice" title="Random verse">🎲</button>
      <button id="booksBtn" class="lwb-bbe__btn" title="Books">Books</button>
      <div class="lwb-bbe__sep"></div>
      <button id="viewBtn" class="lwb-bbe__btn" title="Chapter-only view">Chapter ▾</button>
    </div>

    <aside id="bbeTOC" class="lwb-bbe__toc" aria-hidden="true" aria-label="Books"></aside>

    <div class="lwb-bbe__body">
      <div class="lwb-bbe__status" id="bbeStatus">Loading…</div>

      <article class="lwb-bbe__chapter" hidden>
        <h2 class="lwb-bbe__heading" id="bbeHeading"></h2>
        <div class="lwb-bbe__text" id="bbeText"></div>

        <div class="lwb-bbe__pager">
          <button id="prevChap" class="lwb-bbe__btn" title="Previous Chapter">◀ Previous Chapter</button>
          <button id="nextChap" class="lwb-bbe__btn" title="Next Chapter">Next Chapter ▶</button>
        </div>
      </article>

      <div class="lwb-bbe__share" aria-label="Share">
        <button class="share__btn" id="shareFb" title="Share on Facebook">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M13 8h2V6h-2c-1.7 0-3 1.3-3 3v2H8v2h2v5h2v-5h2l.5-2H12V9c0-.6.4-1 1-1Z"></path></svg>
          <span>Facebook</span>
        </button>
        <button class="share__btn" id="shareX"  title="Share on X">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"></path></svg>
          <span>X</span>
        </button>
        <button class="share__btn" id="shareLi" title="Share on LinkedIn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8" cy="9" r="1.2"></circle><path d="M7 11v6M11 17v-3.5a2.5 2.5 0 1 1 5 0V17"></path></svg>
          <span>LinkedIn</span>
        </button>
        <button class="share__btn" id="shareIg" title="Share on Instagram">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.5" cy="6.5" r="1.2"></circle></svg>
          <span>Instagram</span>
        </button>
        <button class="share__btn" id="shareMail" title="Share by Email">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="12" rx="2"></rect><path d="M3 7l7 5 7-5"></path></svg>
          <span>Email</span>
        </button>
        <button class="share__btn" id="shareCopy" title="Copy link">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7h-4a4 4 0 0 0 0 8h4"></path><path d="M10 17h4a4 4 0 0 0 0-8h-4"></path></svg>
          <span>Copy</span>
        </button>
      </div>

      <div class="lwb-bbe__foot">
        Copyright © 2025 | <a href="/" target="_blank" rel="noopener">Living Word Bibles</a> | All Rights Reserved
        <div class="lwb-bbe__ver">LWB Bible Widget v1.2 Alpha</div>
      </div>
    </div>
  `;

  /* ---------- Elements ---------- */
  const els = {
    status:  document.getElementById('bbeStatus'),
    chapterA: root.querySelector('.lwb-bbe__chapter'),
    heading: document.getElementById('bbeHeading'),
    text:    document.getElementById('bbeText'),

    input:   document.getElementById('bbeInput'),
    go:      document.getElementById('bbeGo'),

    book:    document.getElementById('bookSel'),
    chap:    document.getElementById('chapSel'),
    verse:   document.getElementById('verseSel'),

    dice:    document.getElementById('diceBtn'),
    booksBtn:document.getElementById('booksBtn'),
    toc:     document.getElementById('bbeTOC'),

    viewBtn: document.getElementById('viewBtn'),
    prevC:   document.getElementById('prevChap'),
    nextC:   document.getElementById('nextChap'),

    shareFb: root.querySelector('#shareFb'),
    shareX:  root.querySelector('#shareX'),
    shareLi: root.querySelector('#shareLi'),
    shareIg: root.querySelector('#shareIg'),
    shareMail: root.querySelector('#shareMail'),
    shareCopy: root.querySelector('#shareCopy')
  };

  /* ---------- State & caches ---------- */
  const CHAPTERS = new Map(); // book -> Set(chapterNums we've seen)
  const MAXV     = new Map(); // key book|chapter -> last verse number
  function keyBC(b,c){ return b+'|'+c; }

  const state = { book:'Genesis', chapter:1, verse:1 };

  /* ---------- Helpers ---------- */
  const isNum = s => /^\d+$/.test(String(s||'').trim());
  function canonBookName(s){
    if(!s) return '';
    let x = String(s).trim().toLowerCase()
      .replace(/[–—]/g,'-')
      .replace(/(\d)([a-z])/gi,'$1 $2')
      .replace(/([a-z])(\d)/gi,'$1 $2')
      .replace(/[._,;]+/g,' ')
      .replace(/^(first|1st|i)\b\s*/i,'1 ')
      .replace(/^(second|2nd|ii)\b\s*/i,'2 ')
      .replace(/^(third|3rd|iii)\b\s*/i,'3 ');
    if(ALIAS[x]) return ALIAS[x];
    const xnos = x.replace(/\s+/g,' ');
    if(ALIAS[xnos]) return ALIAS[xnos];
    const cap = xnos.replace(/\b\w/g,c=>c.toUpperCase());
    return BOOKS.includes(cap) ? cap : null;
  }
  function parseRef(s){
    const str = (s||'').trim();
    if(!str) return null;
    const parts = str.split(/[\s:]+/);
    for(let i=parts.length;i>0;i--){
      const b = canonBookName(parts.slice(0,i).join(' '));
      if(b){
        const rest = parts.slice(i);
        let c = 1, v = 1;
        if(rest.length>=1 && isNum(rest[0])) c = +rest[0];
        if(rest.length>=2 && isNum(rest[1])) v = +rest[1];
        return {book:b, chapter:c, verse:v};
      }
    }
    return null;
  }
  const hashKey = ()=> KEY;
  const toHash  = (o)=> `#${hashKey()}=${encodeURIComponent(`${o.book} ${o.chapter}:${o.verse}`)}`;
  function fromHash(){
    const m = (location.hash||'').match(new RegExp(`#${hashKey()}=([^&]+)`));
    return m ? parseRef(decodeURIComponent(m[1])) : null;
  }
  function top(){ try{ root.scrollIntoView({behavior:'auto', block:'start'}); }catch(_){ window.scrollTo(0,0);} }

  /* ---------- API ---------- */
  async function fetchChapter(book, chapter){
    const id = BOOK_ID[book];
    if(!id) throw new Error(`Unknown book: ${book}`);
    const url = `${API}/${id}/${chapter}`;
    const r = await fetch(url, {cache:'no-store', mode:'cors'});
    if(!r.ok) throw new Error(`HTTP ${r.status} @ ${url}`);
    const j = await r.json();
    const verses = Array.isArray(j?.verses) ? j.verses : (Array.isArray(j) ? j : []);
    const byNum = {};
    for(const v of verses){
      const n = +v.verse || +v.verse_number || +v.verse_id || 0;
      const t = String(v.text ?? v.content ?? v.v ?? '').trim();
      if(n>0){ byNum[n]=t; }
    }
    const nums = Object.keys(byNum).map(n=>+n).filter(n=>n>0);
    const maxV = nums.length ? Math.max(...nums) : 1;
    // cache what we learned
    if(!CHAPTERS.has(book)) CHAPTERS.set(book, new Set());
    CHAPTERS.get(book).add(chapter);
    MAXV.set(keyBC(book,chapter), maxV);
    return { byNum, maxV };
  }

  /* ---------- UI fill ---------- */
  function populateBooks(){
    els.book.innerHTML = '';
    for(const b of BOOKS){
      const o = document.createElement('option'); o.value=b; o.textContent=b; els.book.appendChild(o);
    }
  }
  function populateChapters(book){
    els.chap.innerHTML = '';
    // if we don't know max chapters, just show 1–200 progressively; we’ll clamp on fetch
    const maxGuess = 200;
    for(let i=1;i<=maxGuess;i++){
      const o = document.createElement('option'); o.value=i; o.textContent=i; els.chap.appendChild(o);
    }
  }
  function populateVerses(book, chapter){
    els.verse.innerHTML = '';
    const mv = MAXV.get(keyBC(book,chapter)) || 150;
    for(let i=1;i<=mv;i++){
      const o = document.createElement('option'); o.value=i; o.textContent=i; els.verse.appendChild(o);
    }
  }

  function updatePagerButtons(){
    // Prev/Next should ONLY move chapter within the same book (no cross-book jump)
    // Disable at boundaries we know; if unknown, buttons enable until we learn.
    const knownChaps = CHAPTERS.get(state.book) || new Set();
    const atFirst = state.chapter === 1;
    let atLast = false;

    // Heuristic: if we have fetched "next" and it failed once we'd know, but here we
    // disable Next only when the next chapter is *already known missing*. Since we
    // probe on click, we keep Next enabled until fetch fails, then re-enable current.
    if(knownChaps.size){
      // If we’ve seen a chapter N but fetching N+1 failed earlier (no cache for that),
      // we’ll disable after the failed attempt. For now, only disable when we know
      // next chapter text exists and we’re on it being the last seen sequentially.
      // Simpler: disable when we have a max contiguous block and we’re at its end.
      // (We’ll adjust after a failed attempt.)
    }

    els.prevC.disabled = atFirst;
    // We leave Next enabled optimistically; it will no-op + disable if next chapter 404s.
  }

  /* ---------- Render ---------- */
  async function render(book, chapter, verse, opts={}){
    els.status.textContent = 'Loading…';
    els.chapterA.hidden = true;

    try{
      const { byNum, maxV } = await fetchChapter(book, chapter);
      const v = byNum[verse] ? verse : 1;

      state.book = book; state.chapter = chapter; state.verse = v;

      // fill selects
      if(els.book.value !== book) els.book.value = book;
      if(!els.chap.options.length) populateChapters(book);
      els.chap.value = String(chapter);
      populateVerses(book, chapter);
      els.verse.value = String(v);

      // paint chapter (chapter-only)
      els.heading.textContent = `${book} ${chapter} (BBE)`;
      els.text.innerHTML = Object.keys(byNum).sort((a,b)=>a-b).map(n=>`<span class="v">${n}</span>${byNum[n]}`).join(' ');
      els.status.textContent = '';
      els.chapterA.hidden = false;

      updatePagerButtons();

      // push hash
      const h = toHash(state);
      if(location.hash !== h) history.replaceState(null,'',h);

      if(opts.scrollTop) top();

      // wire shares
      wireShares();

    }catch(err){
      els.status.textContent = 'Startup error: ' + (err && err.message ? err.message : String(err));
    }
  }

  /* ---------- Books TOC ---------- */
  function buildTOC(){
    if(els.toc.dataset.ready) return;
    els.toc.innerHTML = '';
    BOOKS.forEach(b=>{
      const a = document.createElement('a'); a.href='javascript:void(0)'; a.textContent=b;
      a.addEventListener('click', ()=>{ render(b, 1, 1, {scrollTop:true}); toggleTOC(false); });
      els.toc.appendChild(a);
    });
    els.toc.dataset.ready = '1';
  }
  function toggleTOC(force){
    const open = force!==undefined ? force : (els.toc.getAttribute('aria-hidden')!=='false');
    els.toc.setAttribute('aria-hidden', open ? 'false' : 'true');
    if(open) buildTOC();
  }

  /* ---------- Sharing ---------- */
  function currentURL(){ return location.href; }
  function shareText(){ return `${els.heading.textContent}`; }
  function openWin(url){ window.open(url,'_blank','noopener,noreferrer'); }
  function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent||''); }
  function wireShares(){
    const url = currentURL();
    els.shareFb.onclick = ()=> openWin(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
    els.shareX.onclick  = ()=> openWin(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(url)}`);
    els.shareLi.onclick = ()=> openWin(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`);
    els.shareIg.onclick = async ()=>{
      if(isMobile() && navigator.share){ try{ await navigator.share({ title: els.heading.textContent, text: shareText(), url }); }catch{} }
      else { openWin('https://www.instagram.com/living.word.bibles/'); }
    };
    els.shareMail.onclick = ()=> location.href = `mailto:?subject=${encodeURIComponent(shareText())}&body=${encodeURIComponent(url)}`;
    els.shareCopy.onclick = async ()=>{ try{ await navigator.clipboard.writeText(url); els.shareCopy.querySelector('span').textContent='Copied!'; setTimeout(()=>els.shareCopy.querySelector('span').textContent='Copy',1200);}catch{} };
  }

  /* ---------- Random ---------- */
  function randomRef(){
    const b = BOOKS[Math.floor(Math.random()*BOOKS.length)];
    const c = 1 + Math.floor(Math.random()*150); // will clamp on fetch
    const v = 1 + Math.floor(Math.random()*180);
    return {book:b, chapter:c, verse:v};
  }

  /* ---------- Events ---------- */
  root.querySelector('.lwb-bbe__logo').addEventListener('error', (e)=>{
    e.currentTarget.removeAttribute('src');
  });

  els.go.addEventListener('click', ()=>{
    const r = parseRef(els.input.value);
    if(r) render(r.book, r.chapter, r.verse, {scrollTop:true});
    else { els.input.focus(); els.input.select(); }
  });
  els.input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') els.go.click(); });

  els.book.addEventListener('change', ()=>{ populateChapters(els.book.value); render(els.book.value, 1, 1, {scrollTop:true}); });
  els.chap.addEventListener('change', ()=>{ render(els.book.value, +els.chap.value, 1, {scrollTop:true}); });
  els.verse.addEventListener('change', ()=>{ render(els.book.value, +els.chap.value, +els.verse.value, {scrollTop:false}); });

  els.dice.addEventListener('click', ()=>{ const r = randomRef(); render(r.book, r.chapter, r.verse, {scrollTop:true}); });
  els.booksBtn.addEventListener('click', ()=> toggleTOC());

  // CHAPTER-ONLY Prev/Next: never cross into another book
  els.prevC.addEventListener('click', async ()=>{
    if(state.chapter <= 1){ els.prevC.disabled = true; return; }
    render(state.book, state.chapter - 1, 1, {scrollTop:true});
  });

  els.nextC.addEventListener('click', async ()=>{
    // Try to fetch next chapter; if the API 404s, keep user on current chapter and disable Next.
    const nextCh = state.chapter + 1;
    try{
      await fetchChapter(state.book, nextCh); // probe
      render(state.book, nextCh, 1, {scrollTop:true});
    }catch(_){
      els.nextC.disabled = true;
    }
  });

  window.addEventListener('hashchange', ()=>{
    const r = fromHash(); if(r) render(r.book, r.chapter, r.verse, {scrollTop:true});
  });

  /* ---------- Boot ---------- */
  (async function init(){
    try{
      populateBooks();
      populateChapters(BOOKS[0]);
      const start = fromHash() || parseRef(START) || {book:'Genesis', chapter:1, verse:1};
      await render(start.book, start.chapter, start.verse, {scrollTop:false});
    }catch(err){
      els.status.textContent = 'Startup error: ' + (err && err.message ? err.message : String(err));
    }
  })();
})();
</script>
