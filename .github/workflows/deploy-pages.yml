name: Deploy Living Word Bibles to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify static entry files
        run: |
          test -f index.html
          test -f 404.html
          test -f CNAME
          test -f sitemap.xml
          test -f assets/includes/lwb-header.html
          test -f assets/includes/lwb-footer.html
          test -f assets/js/config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository root as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
