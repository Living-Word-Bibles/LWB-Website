        logoEl.replaceWith(badge); return;
      }
      const u = list.shift(); const test = new Image();
      test.onload = ()=> logoEl.src = u;
      test.onerror = ()=> tryNext(list);
      test.src = u;
    })(cands.slice());
  })();

  // ===== Elements

  // ===== Helpers & parsing
  function canonBookName(s){
    if(!s) return '';
    let x = String(s).trim().toLowerCase()
      .replace(/[–—]/g,'-')
      .replace(/(\d)([a-z])/gi,'$1 $2')
      .replace(/([a-z])(\d)/gi,'$1 $2')
      .replace(/[._,;]+/g,' ')
      .replace(/^(first|1st|i)\b\s*/i,'1 ')
      .replace(/^(second|2nd|ii)\b\s*/i,'2 ')
      .replace(/^(third|3rd|iii)\b\s*/i,'3 ')
      .replace(/^psalm\b/,'psalms') /* Psalm -> Psalms */
      .replace(/^(song of songs|canticles?)\b/,'song of solomon');
    return x.replace(/\s+/g,' ').trim();
  }
  function findBook(input){
    const t = canonBookName(input);
    let hit = BOOKS.find(b=>canonBookName(b)===t) || BOOKS.find(b=>canonBookName(b).startsWith(t));
    if(hit) return hit;
    const ALIAS = {
      ge:'Genesis', gen:'Genesis', gn:'Genesis',
      ex:'Exodus', exo:'Exodus', exod:'Exodus',
      lev:'Leviticus', lv:'Leviticus',
      nu:'Numbers', num:'Numbers', nm:'Numbers',
      dt:'Deuteronomy', deut:'Deuteronomy',
      jos:'Joshua', josh:'Joshua',
      jdg:'Judges', judg:'Judges',
      ru:'Ruth', rut:'Ruth',
      '1sa':'1 Samuel','2sa':'2 Samuel','1 sam':'1 Samuel','2 sam':'2 Samuel',
      '1ki':'1 Kings','2ki':'2 Kings','1 kgs':'1 Kings','2 kgs':'2 Kings',
      '1ch':'1 Chronicles','2ch':'2 Chronicles',
      ezr:'Ezra', neh:'Nehemiah', est:'Esther', job:'Job',
      ps:'Psalms', psa:'Psalms', psalm:'Psalms', pss:'Psalms', psalter:'Psalms',
      pr:'Proverbs', prov:'Proverbs',
      ec:'Ecclesiastes', ecc:'Ecclesiastes', eccl:'Ecclesiastes', qoh:'Ecclesiastes',
      sos:'Song of Solomon', song:'Song of Solomon', songs:'Song of Solomon', cant:'Song of Solomon',
      isa:'Isaiah', jer:'Jeremiah', lam:'Lamentations', eze:'Ezekiel', ezk:'Ezekiel', dan:'Daniel',
      hos:'Hosea', jl:'Joel', joe:'Joel', am:'Amos', ob:'Obadiah', jon:'Jonah',
      mic:'Micah', nah:'Nahum', hab:'Habakkuk', zep:'Zephaniah', hag:'Haggai', zec:'Zechariah', mal:'Malachi',
      mt:'Matthew', matt:'Matthew', mk:'Mark', mar:'Mark',
      lk:'Luke', luk:'Luke', jn:'John', joh:'John', jhn:'John',
      act:'Acts', rom:'Romans',
      '1co':'1 Corinthians','2co':'2 Corinthians','1 cor':'1 Corinthians','2 cor':'2 Corinthians',
      gal:'Galatians', eph:'Ephesians', php:'Philippians', phil:'Philippians', col:'Colossians',
      '1th':'1 Thessalonians','2th':'2 Thessalonians',
      '1ti':'1 Timothy','2ti':'2 Timothy',
      tit:'Titus', phm:'Philemon', heb:'Hebrews', jas:'James',
      '1pe':'1 Peter','2pe':'2 Peter',
      '1jn':'1 John','2jn':'2 John','3jn':'3 John',
      jud:'Jude', rev:'Revelation'
    };
    const mapped = ALIAS[t] || ALIAS[t.replace(/\s+/g,'')];
    if(mapped) return mapped;
    return null;
  }
  function parseJump(input){
    if(!input) return null;
    let s = String(input).trim().toLowerCase()
      .replace(/[–—]/g,'-')
      .replace(/(\d)([a-z])/gi,'$1 $2')
      .replace(/([a-z])(\d)/gi,'$1 $2')
      .replace(/[.,;]+/g,' ')
      .replace(/\bco\b/g,'cor');
    let m = s.match(/^(.+?)\s+(\d+)\s*[:\s]\s*(\d+)\s*$/i) || s.match(/^(.+?)\s+(\d+)\s*$/i);
    if(!m) return null;
    const bookGuess = findBook(m[1]); if(!bookGuess) return null;
    const chapter = parseInt(m[2],10); const verse = m[3]? parseInt(m[3],10) : 1;
    return { book: bookGuess, chapter, verse };
  }

  function escapeHtml(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  function cleanVerseText(node){
    const s=stripTags(node.innerHTML); const space=s.indexOf(' ');
    if(space>0 && isAllDigits(s.slice(0,space))) return s.slice(space+1);
    return s;
  }

  function detectFields(sample){

    const pick = arr=> arr.find(k=>k in sample)||null;
    const bk=pick(opts.bk), ch=pick(opts.ch), vs=pick(opts.vs), tx=pick(opts.tx);
    if(!bk||!ch||!vs||!tx) return null; return {bk,ch,vs,tx};
  }
  function normalizeBookName(v){
    if(typeof v==='number'){ return BOOKS[Math.max(1,Math.min(66,v))-1]; }
    const s=String(v).trim();
    const map={
      'Ps':'Psalms','Psa':'Psalms','Psalm':'Psalms', /* Psalm -> Psalms */
      'Prov':'Proverbs','Eccl':'Ecclesiastes','Song':'Song of Solomon','Song of Songs':'Song of Solomon','Canticles':'Song of Solomon',
      'Mt':'Matthew','Mk':'Mark','Lk':'Luke','Jn':'John','Rev':'Revelation'
    };
    return map[s] || s;
  }
  function flattenBibleJSON(input){
    if(Array.isArray(input)){
      const f=detectFields(input[0]); if(f){
        return input.map(r=>({book:normalizeBookName(r[f.bk]),chapter:Number(r[f.ch]),verse:Number(r[f.vs]),text:String(r[f.tx]).trim()}));
      }
    }
    if(input && Array.isArray(input.books)){
      const out=[];
      input.books.forEach((b,bi)=>{
        const bname=normalizeBookName(b.name||b.title||BOOKS[bi]||'');
        (b.chapters||b.Chapters||[]).forEach((c,ci)=>{
          const cnum=Number(c.chapter||c.number||ci+1);
          (c.verses||c.Verses||[]).forEach((v,vi)=>{
            if(typeof v==='string'){ out.push({book:bname,chapter:cnum,verse:vi+1,text:v}); }
            else if(v){ out.push({book:bname,chapter:cnum,verse:Number(v.verse||v.number||vi+1),text:String(v.text||v.content||v.verse_text||'').trim()}); }
          });
        });
      });
      return out;
    }
    if(input && typeof input==='object'){
      const out=[];
      for(const bk of Object.keys(input)){
        const bname=normalizeBookName(bk);
        const chs=input[bk]; if(!chs||typeof chs!=='object') continue;
        for(const ch of Object.keys(chs)){
          const cnum=Number(ch); const vobj=chs[ch]; if(typeof vobj!=='object') continue;
          for(const vs of Object.keys(vobj)){
            out.push({book:bname,chapter:cnum,verse:Number(vs),text:String(vobj[vs]).trim()});
          }
        }
      }
      if(out.length) return out;
    }
    throw new Error('Unsupported YLT JSON shape');
  }

  async function fetchData(){
    let lastErr=null;
    for(const u of CONFIG.DATA_URLS){
      try{
        const r=await fetch(u,{cache:'force-cache'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();
      }catch(e){ lastErr=e; }
    }
    throw lastErr||new Error('All fetches failed');
  }

  function buildIndex(rows){
    rows.forEach(({book,chapter,verse,text})=>{
      if(BOOKS.indexOf(book)===-1) return;
      const k=keyBC(book,chapter);
      if(!idx.byBC.has(k)) idx.byBC.set(k,[]);
      idx.byBC.get(k).push({v:verse,t:text});
      idx.maxChapter.set(book, Math.max(idx.maxChapter.get(book)||0, chapter));
      idx.maxVerse.set(k, Math.max(idx.maxVerse.get(k)||0, verse));
    });
    for(const [k,arr] of idx.byBC.entries()) arr.sort((a,b)=>a.v-b.v);
  }

  // ===== UI setup
  function ensureDefaultSel(sel){ if(sel && !sel.value && sel.options.length){ sel.value = sel.options[0].value; } }
  function populateBooks(){
    els.book.innerHTML='';
    for(const b of BOOKS){ if(!idx.maxChapter.has(b)) continue; const o=document.createElement('option'); o.value=b; o.textContent=b; els.book.append(o); }
    ensureDefaultSel(els.book);
  }
  function populateChapters(book){
    els.chap.innerHTML='';
    const maxC=idx.maxChapter.get(book)||1;
    for(let c=1;c<=maxC;c++){ const o=document.createElement('option'); o.value=c; o.textContent=c; els.chap.append(o); }
    ensureDefaultSel(els.chap);
    populateVerses(book, Number(els.chap.value||1));
  }
  function populateVerses(book, chap){
    els.verse.innerHTML='';
    const maxV=idx.maxVerse.get(keyBC(book,chap))||1;
    for(let v=1; v<=maxV; v++){ const o=document.createElement('option'); o.value=v; o.textContent=v; els.verse.append(o); }
    ensureDefaultSel(els.verse);
  }

  // ===== State / Hash
  const state = { view: localStorage.getItem('ylt_view') || 'verse' };
  function setView(v){
    state.view = v;
    localStorage.setItem('ylt_view', v);
    els.viewBtn.textContent = (v==='verse') ? 'Verse ▾' : 'Chapter ▴';
    els.pager.setAttribute('aria-hidden', v==='chapter' ? 'false' : 'true');
  }
  function parseHash(){
    if(!location.hash) return null;
    const raw=decodeURIComponent(location.hash.slice(1));
    const m=raw.match(/^(.+?)\.(\d+)\.(\d+)$/);
    if(!m) return null;
    return { book:m[1], chapter:Number(m[2]), verse:Number(m[3]) };
  }
  function setHash(o){
    const h = `#${encodeURIComponent(o.book)}.${o.chapter}.${o.verse}`;
    if(location.hash!==h) history.replaceState(null,'',h);
  }

  function setRef(book, chapter, verse, opts){
    opts=opts||{pushHash:true};
    if(!idx.byBC.has(keyBC(book,chapter))){
      // fallback to nearest available
      book = nearestBookWithData(book)||BOOKS[0]; chapter=1; verse=1;
    }
    const maxV=idx.maxVerse.get(keyBC(book,chapter))||1;
    if(verse<1) verse=1; if(verse>maxV) verse=maxV;

    // reflect in UI
    if(els.book.value!==book){ els.book.value=book; }
    populateChapters(book);
    els.chap.value = String(chapter);
    populateVerses(book, chapter);
    els.verse.value = String(verse);

    // render
    const list=idx.byBC.get(keyBC(book,chapter))||[];
    const node=list.find(x=>x.v===verse);
    const text=node? node.t : '(verse unavailable)';
    els.ref.textContent = `${book} ${chapter}:${verse}`;
    if(state.view==='chapter'){
      const out = list.map(x=>`<span class="vnum">${x.v}</span>${escapeHtml(x.t)}`).join(' ');
      els.text.innerHTML = out || '(chapter unavailable)';
    } else {
      els.text.innerHTML = `<span class="vnum">${verse}</span>${escapeHtml(text)}`;
    }

    if(opts.pushHash) setHash({book,chapter,verse});
  }

  function nearestBookWithData(book){
    const i=Math.max(0,BOOKS.indexOf(book));
    for(let off=0; off<BOOKS.length; off++){
      const L=BOOKS[i-off]; if(L && idx.maxChapter.get(L)) return L;
      const R=BOOKS[i+off]; if(R && idx.maxChapter.get(R)) return R;
    }
    return BOOKS.find(b=>idx.maxChapter.get(b));
  }

  function stepVerse(delta){
    let b=els.book.value, c=Number(els.chap.value||1), v=Number(els.verse.value||1);
    v+=delta;
    const maxV=idx.maxVerse.get(keyBC(b,c))||1;
    if(v<1){
      const prev=c-1;
      if(prev>=1){ c=prev; v=idx.maxVerse.get(keyBC(b,c))||1; }
      else { const bi=Math.max(0,BOOKS.indexOf(b)-1); b=BOOKS[bi]; c=idx.maxChapter.get(b)||1; v=idx.maxVerse.get(keyBC(b,c))||1; }
    } else if(v>maxV){
      const next=c+1; const maxC=idx.maxChapter.get(b)||c;
      if(next<=maxC){ c=next; v=1; }
      else { const bi=Math.min(BOOKS.length-1,BOOKS.indexOf(b)+1); b=BOOKS[bi]; c=1; v=1; }
    }
    setRef(b,c,v);
  }

  /* Chapter pager: clamp within current book (do NOT cross to other books) */
  function stepChapter(delta){
    let b=els.book.value, c=Number(els.chap.value||1);
    const maxC=idx.maxChapter.get(b)||1;
    c += delta;
    if(c<1) c=1;
    if(c>maxC) c=maxC;
    setRef(b,c,1);
    scrollToTopOfWidget();
  }

  function randomVerse(){
    const books=BOOKS.filter(b=>idx.maxChapter.get(b));
    const b=books[Math.floor(Math.random()*books.length)];
    const cMax=idx.maxChapter.get(b)||1; const c=1+Math.floor(Math.random()*cMax);
    const vMax=idx.maxVerse.get(keyBC(b,c))||1; const v=1+Math.floor(Math.random()*vMax);
    setRef(b,c,v);
  }

  // ===== Share helpers
  function shareUrl(){
    const h=parseHash()||CONFIG.START_REF;
    const path=`${encodeURIComponent(h.book)}.${h.chapter}.${h.verse}`;
    return `${CONFIG.CANONICAL_ORIGIN}${CONFIG.CANONICAL_PATH}#${path}`;
  }
  function buildSharePayload(){
    const ref=els.ref.textContent; const text=cleanVerseText(els.text); const url=shareUrl();
    const title=`${ref}`; const tweet = `${title} — ${text}`;
    return {ref,text,url,title,tweet};
  }
  function openWin(u){ window.open(u,'_blank','noopener'); }
  function shareFacebook(){ const {url}=buildSharePayload(); openWin('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)); }
  function shareX(){ const {url,tweet}=buildSharePayload(); openWin('https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet)+'&url='+encodeURIComponent(url)); }
  function shareLinkedIn(){ const {url}=buildSharePayload(); openWin('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(url)); }
  function shareEmail(){ const {title,text,url}=buildSharePayload(); const subj=encodeURIComponent(title); const body=encodeURIComponent(text+'\n'+url); location.href='mailto:?subject='+subj+'&body='+body; }
  function copyVerse(){ const {title,text,url}=buildSharePayload(); const payload=`${title} — ${text}\n${url}`; navigator.clipboard.writeText(payload).then(()=>{ els.copy.classList.add('copy-ok'); setTimeout(()=>els.copy.classList.remove('copy-ok'), 1200); }).catch(()=>{}); }

  // ===== Books TOC
  function toggleTOC(){
    const hidden = els.toc.getAttribute('aria-hidden') !== 'false';
    els.toc.setAttribute('aria-hidden', hidden ? 'false' : 'true');
    if(hidden && !els.toc.dataset.ready){
      buildTOC();
      els.toc.dataset.ready='1';
    }
  }
  function buildTOC(){
    els.tocInner.innerHTML='';
    BOOKS.forEach(name=>{
      if(!idx.maxChapter.get(name)) return;
      const a=document.createElement('a'); a.href='javascript:void(0)'; a.textContent=name;
      a.addEventListener('click', ()=>{ setRef(name,1,1); setView('chapter'); toggleTOC(); scrollToTopOfWidget(); });
      els.tocInner.appendChild(a);
    });
  }

  // ===== Init
  function initUI(){
    populateBooks();
    populateChapters(els.book.value);
    els.go.addEventListener('click', ()=>{ const r=parseJump(els.jump.value); if(r) setRef(r.book,r.chapter,r.verse); });
    els.jump.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const r=parseJump(els.jump.value); if(r) setRef(r.book,r.chapter,r.verse); } });

    els.book.addEventListener('change', ()=>{ populateChapters(els.book.value); setRef(els.book.value, Number(els.chap.value||1), Number(els.verse.value||1)); });
    els.chap.addEventListener('change', ()=>{ populateVerses(els.book.value, Number(els.chap.value||1)); setRef(els.book.value, Number(els.chap.value||1), Number(els.verse.value||1)); });
    els.verse.addEventListener('change', ()=>{ setRef(els.book.value, Number(els.chap.value||1), Number(els.verse.value||1)); });

    els.prev.addEventListener('click', ()=> stepVerse(-1));
    els.next.addEventListener('click', ()=> stepVerse(1));
    els.dice.addEventListener('click', randomVerse);

    els.viewBtn.addEventListener('click', ()=>{ setView(state.view==='verse'?'chapter':'verse'); setRef(els.book.value, Number(els.chap.value||1), Number(els.verse.value||1)); if(state.view==='chapter') scrollToTopOfWidget(); });
    els.booksBtn.addEventListener('click', toggleTOC);

    els.prevChap.addEventListener('click', ()=> stepChapter(-1));
    els.nextChap.addEventListener('click', ()=> stepChapter(1));

    // Share buttons
    els.fb.addEventListener('click', shareFacebook);
    els.x.addEventListener('click', shareX);
    els.li.addEventListener('click', shareLinkedIn);
    els.email.addEventListener('click', shareEmail);
    els.copy.addEventListener('click', copyVerse);

    // Hash routing
    window.addEventListener('hashchange', ()=>{ const h=parseHash(); if(h) setRef(h.book,h.chapter,h.verse,{pushHash:false}); });
  }

  (async function boot(){
    try{
      const raw = await fetchData();
      const rows = flattenBibleJSON(raw);
      buildIndex(rows);
      initUI();
      setView(state.view);
      const start = parseHash()||CONFIG.START_REF;
      setRef(start.book,start.chapter,start.verse);
      document.title = 'The Holy Bible: Young’s Literal Translation';
    }catch(e){
      console.error(e);
      els.err.textContent = 'Could not load YLT data. ' + (e && e.message ? e.message : e);
    }
  })();
})();
</script>
