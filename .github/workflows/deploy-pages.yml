name: Deploy Living Word Bibles to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate checked-in static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate page-level site
        run: npm run validate

      - name: Verify static entry files
        run: |
          test -f index.html
          test -f 404.html
          test -f CNAME
          test -f sitemap.xml
          test -f assets/includes/lwb-header.html
          test -f assets/includes/lwb-footer.html
          test -f assets/js/config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload repository root as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Publish website
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
