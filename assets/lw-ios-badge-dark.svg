<svg xmlns="http://www.w3.org/2000/svg" width="240" height="72" viewBox="0 0 240 72">
  <defs>
    <style><![CDATA[
      .btn{fill:#111}
      .txt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";fill:#fff}
      .small{font-size:14px;opacity:.9}
      .big{font-size:22px;font-weight:700}
      .icon{fill:#fff}
    ]]></style>
  </defs>
  <rect class="btn" x="1" y="1" rx="14" ry="14" width="238" height="70"/>
  <!-- generic phone icon -->
  <g transform="translate(22,14)">
    <rect x="0" y="0" width="32" height="44" rx="6" ry="6" class="icon"/>
    <rect x="4" y="6" width="24" height="28" rx="3" ry="3" fill="#111"/>
    <circle cx="16" cy="39" r="2.1" fill="#111"/>
  </g>
  <text class="txt small" x="72" y="34">Get the</text>
  <text class="txt big" x="72" y="56">iOS App</text>
</svg>