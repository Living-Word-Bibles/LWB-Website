<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap');

  .lwb-web{

<script>
(function(){
  const mount = document.getElementById('web-bible-widget');
  const LOGO_URL = '/assets/LivingWordBibles01.png';

  /* Data sources (pinned commit, plus raw GitHub fallback) */
  const DATA_URLS = [
    'https://cdn.jsdelivr.net/gh/jadenzaleski/bible-translations@86d528c69b5bbcca9ce0dc0b17b037c1128c6651/WEB/WEB_bible.json',
    'https://raw.githubusercontent.com/jadenzaleski/bible-translations/86d528c69b5bbcca9ce0dc0b17b037c1128c6651/WEB/WEB_bible.json'
  ];

  /* Canonical URL bits (for sharing) */
  const CANON = { origin: '/', path: '/read-the-bible-online/web' };

  /* Canon lists */
  const OT = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi'];
  const NT = ['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
  const BOOKS = [...OT, ...NT];

  const state = {
    book: 'Genesis',
    chapter: 1,
    verse: 1,
    view: localStorage.getItem('web_view') || 'verse', /* 'verse' | 'chapter' */
    fontRem: parseFloat(localStorage.getItem('web_font') || '1.18')
  };

  const $ = (sel, r=mount)=> r.querySelector(sel);
  const el = (t,c)=>{const e=document.createElement(t); if(c) e.className=c; return e;};
  const keyBC = (b,c)=> b+'|'+c;

  /* Build UI skeleton */
  mount.innerHTML = `
    <div class="web__head">
      <img class="web__logo" alt="Living Word Bibles" src="${LOGO_URL}" loading="lazy" decoding="async">
      <div class="web__title">The Holy Bible</div>
      <div class="web__subtitle">World English Bible</div>
    </div>

    <div class="web__controls" aria-label="Controls">
      <label class="sr-only" for="web-ref">Passage</label>
      <input id="web-ref" class="web__input" type="text" placeholder="e.g., Ps 23, Jn 3:16, 1 Jn 1:9, Song 2:1">
      <button id="web-go" class="web__btn" type="button">Go</button>

      <select id="web-book" class="web__select" aria-label="Book"></select>
      <select id="web-chap" class="web__select" aria-label="Chapter"></select>
      <select id="web-verse" class="web__select" aria-label="Verse"></select>

      <button id="web-prev" class="web__btn" title="Previous verse">◀</button>
      <button id="web-next" class="web__btn" title="Next verse">▶</button>

      <div class="web__sep" role="separator"></div>
      <button id="web-dice" class="web__btn" title="Random verse">🎲</button>
      <button id="web-view" class="web__btn" title="Toggle verse/chapter view">Verse ▾</button>
      <button id="web-books" class="web__btn" title="Books">Books</button>
      <button id="web-a-plus" class="web__btn" title="A+">A+</button>
      <button id="web-a-minus" class="web__btn" title="A−">A−</button>
    </div>

    <aside id="web-toc" class="web__toc" aria-hidden="true" aria-label="Books">
      <div class="web__toc-title">Books</div>
      <div id="web-toc-inner" class="web__toc-inner"></div>
    </aside>

    <div class="web__body">
      <div class="web__ref" id="web-refline">Loading…</div>
      <div class="web__text" id="web-text"></div>
    </div>

    <div id="web-bottom-pager" class="web__pager" aria-hidden="true">
      <button id="web-bottom-prev" class="web__btn" type="button" title="Previous Chapter">◀ Previous Chapter</button>
      <button id="web-bottom-next" class="web__btn" type="button" title="Next Chapter">Next Chapter ▶</button>
    </div>

    <div class="web__share" role="region" aria-label="Share">
      <button id="share-fb" class="shbtn" title="Share on Facebook">${icon('fb')} <span>Facebook</span></button>
      <a id="share-ig" class="shbtn" title="Instagram" href="https://www.instagram.com/living.word.bibles/" target="_blank" rel="noopener">${icon('ig')} <span>Instagram</span></a>
      <button id="share-x" class="shbtn" title="Share on X">${icon('x')} <span>X</span></button>
      <button id="share-ln" class="shbtn" title="Share on LinkedIn">${icon('ln')} <span>LinkedIn</span></button>
      <button id="share-email" class="shbtn" title="Share by Email">${icon('email')} <span>Email</span></button>
      <button id="share-copy" class="shbtn" title="Copy">${icon('copy')} <span>Copy</span></button>
    </div>

    <div class="web__foot" role="contentinfo">
      <span>Copyright © 2025 |</span>
      <a href="/" target="_blank" rel="noopener">Living Word Bibles</a>
      <span>| All Rights Reserved</span>
      <div class="web__ver">LWB Bible Widget v1.2 Alpha</div>
    </div>
  `;

  /* Icons */
  function icon(which){
    const map={
      fb:'<svg viewBox="0 0 24 24"><path d="M13 22v-9h3l1-4h-4V7a2 2 0 0 1 2-2h2V1h-3a5 5 0 0 0-5 5v3H7v4h3v9h3z"/></svg>',
      ig:'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-1.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>',
      x:'<svg viewBox="0 0 24 24"><path d="M18.3 2H22l-9.7 11.1L21.4 22h-7l-5.5-6.7L2.6 22H2l8.6-9.8L2 2h7l5 6.1L18.3 2z"/></svg>',
      ln:'<svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.9 3.9 5.9 2.5 5.9S0 4.9 0 3.5 1.1 1.5 2.5 1.5 5 2.9 5 3.5zM0 8.98h5V24H0zM8.48 8.98H13v2.05h.07c.63-1.2 2.16-2.47 4.45-2.47 4.76 0 5.64 3.14 5.64 7.23V24h-5v-6.56c0-1.56-.03-3.56-2.17-3.56-2.17 0-2.5 1.7-2.5 3.45V24h-5V8.98z"/></svg>',
      email:'<svg viewBox="0 0 24 24"><path d="M2 4h20v16H2V4zm10 7L3.5 6.5h17L12 11zm0 2l8.5-6.5V20h-17V6.5L12 13z"/></svg>',
      copy:'<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>'
    }; return map[which]||'';
  }

  /* Fetch + flatten data */
  async function fetchData(){
    let lastErr=null;
    for(const u of DATA_URLS){
      try{
        const r = await fetch(u,{cache:'force-cache'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();
      }catch(e){ lastErr=e; }
    }
    throw lastErr || new Error('All fetches failed');
  }

  /* Index: by (book,chapter) -> [{v,t}...] + maxes */
  const idx = { byBC:new Map(), maxC:new Map(), maxV:new Map() };
  function normalizeBookName(v){
    if(typeof v==='number'){ return BOOKS[Math.max(1,Math.min(66,v))-1]; }
    let s=String(v).trim();
    /* Psalm(s) synonyms */
    if(/^Psalm(s)?$/i.test(s)) s='Psalms';
    const map={
      Gen:'Genesis', Ge:'Genesis', Gn:'Genesis',
      Ex:'Exodus', Exod:'Exodus',
      Lev:'Leviticus', Lv:'Leviticus',
      Num:'Numbers', Nm:'Numbers',
      Deut:'Deuteronomy', Dt:'Deuteronomy',
      Josh:'Joshua', Jos:'Joshua',
      Judg:'Judges', Jdg:'Judges',
      '1Sam':'1 Samuel','2Sam':'2 Samuel','1 Sa':'1 Samuel','2 Sa':'2 Samuel',
      '1Kgs':'1 Kings','2Kgs':'2 Kings','1 Ki':'1 Kings','2 Ki':'2 Kings',
      '1Chr':'1 Chronicles','2Chr':'2 Chronicles',
      Neh:'Nehemiah', Esth:'Esther',
      Ps:'Psalms', Psa:'Psalms',
      Prov:'Proverbs', Prv:'Proverbs',
      Eccl:'Ecclesiastes', Qoh:'Ecclesiastes',
      Song:'Song of Solomon','Song of Songs':'Song of Solomon','Canticles':'Song of Solomon',
      Isa:'Isaiah', Jer:'Jeremiah', Lam:'Lamentations', Ezek:'Ezekiel', Eze:'Ezekiel',
      Dan:'Daniel', Hos:'Hosea', Obad:'Obadiah', Jon:'Jonah', Mic:'Micah', Nah:'Nahum',
      Hab:'Habakkuk', Zeph:'Zephaniah', Hag:'Haggai', Zech:'Zechariah', Mal:'Malachi',
      Matt:'Matthew', Mt:'Matthew', Mk:'Mark', Mrk:'Mark', Lk:'Luke', Lu:'Luke', Jn:'John',
      Rom:'Romans', '1Cor':'1 Corinthians','2Cor':'2 Corinthians', Gal:'Galatians', Eph:'Ephesians',
      Phil:'Philippians', Col:'Colossians', '1Thess':'1 Thessalonians','2Thess':'2 Thessalonians',
      '1Tim':'1 Timothy','2Tim':'2 Timothy', Tit:'Titus', Phlm:'Philemon',
      Heb:'Hebrews', Jas:'James', '1Pet':'1 Peter','2Pet':'2 Peter',
      '1Jn':'1 John','2Jn':'2 John','3Jn':'3 John', Rev:'Revelation'
    };
    return map[s] || s;
  }

  function detectFields(sample){
    const opts={ bk:['book','book_name','name','title','b','book_id','bookid'], ch:['chapter','chapter_num','c','chap','chap_num','number'], vs:['verse','verse_num','v','num','id'], tx:['text','content','verse_text','t','body'] };
    const pick=a=>a.find(k=>k in sample)||null; const bk=pick(opts.bk), ch=pick(opts.ch), vs=pick(opts.vs), tx=pick(opts.tx);
    if(!bk||!ch||!vs||!tx) return null; return {bk,ch,vs,tx};
  }

  function flatten(input){
    if(Array.isArray(input)){
      const f=detectFields(input[0]); if(f){
        return input.map(r=>({book:normalizeBookName(r[f.bk]),chapter:Number(r[f.ch]),verse:Number(r[f.vs]),text:String(r[f.tx]).trim()}));
      }
    }
    if(input && Array.isArray(input.books)){
      const out=[]; input.books.forEach((b,bi)=>{
        const bname=normalizeBookName(b.name||b.title||BOOKS[bi]||'');
        (b.chapters||b.Chapters||[]).forEach((c,ci)=>{
          const cnum=Number(c.chapter||c.number||ci+1);
          (c.verses||c.Verses||[]).forEach((v,vi)=>{
            if(typeof v==='string'){ out.push({book:bname,chapter:cnum,verse:vi+1,text:v}); }
            else if(v){ out.push({book:bname,chapter:cnum,verse:Number(v.verse||v.number||vi+1),text:String(v.text||v.content||v.verse_text||'').trim()}); }
          });
        });
      });
      return out;
    }
    if(input && typeof input==='object'){
      const out=[];
      for(const bk of Object.keys(input)){
        const bname=normalizeBookName(bk); const chs=input[bk]; if(!chs||typeof chs!=='object') continue;
        for(const ch of Object.keys(chs)){
          const cnum=Number(ch); const vobj=chs[ch]; if(typeof vobj!=='object') continue;
          for(const vs of Object.keys(vobj)){ out.push({book:bname,chapter:cnum,verse:Number(vs),text:String(vobj[vs]).trim()}); }
        }
      }
      if(out.length) return out;
    }
    throw new Error('Unsupported JSON shape for WEB.');
  }

  function buildIndex(rows){
    rows.forEach(({book,chapter,verse,text})=>{
      if(BOOKS.indexOf(book)===-1) return;
      const k=keyBC(book,chapter);
      if(!idx.byBC.has(k)) idx.byBC.set(k,[]);
      idx.byBC.get(k).push({v:verse,t:text});
      idx.maxC.set(book, Math.max(idx.maxC.get(book)||0, chapter));
      idx.maxV.set(k, Math.max(idx.maxV.get(k)||0, verse));
    });
    for(const [k,arr] of idx.byBC.entries()) arr.sort((a,b)=>a.v-b.v);
  }

  /* UI helpers */
  function setFont(rem){ rem=Math.max(0.9,Math.min(1.6,rem)); state.fontRem=rem; localStorage.setItem('web_font',String(rem)); $('#web-text').style.fontSize = rem+'rem'; }
  function updateViewBtn(){ $('#web-view').textContent = (state.view==='verse') ? 'Verse ▾' : 'Chapter ▴'; }
  function toggleTOC(){
    const toc = $('#web-toc'); const show = toc.getAttribute('aria-hidden')!=='false';
    toc.setAttribute('aria-hidden', show ? 'false' : 'true');
    if(show && !toc.dataset.ready){ buildTOC(); toc.dataset.ready='1'; }
  }
  function buildTOC(){
    const wrap = $('#web-toc-inner'); wrap.innerHTML='';
    BOOKS.forEach(name=>{
      if(!idx.maxC.get(name)) return;
      const a=el('a'); a.href='javascript:void(0)'; a.textContent=name;
      a.onclick=()=>{ state.book=name; state.chapter=1; state.verse=1; toggleTOC(); render(true); };
      wrap.appendChild(a);
    });
  }
  function ensureSel(sel){ if(sel && !sel.value && sel.options.length){ sel.value=sel.options[0].value; } }

  function populateSelects(){
    const bSel=$('#web-book'), cSel=$('#web-chap'), vSel=$('#web-verse');
    bSel.innerHTML=''; cSel.innerHTML=''; vSel.innerHTML='';

    /* Books (with OT/NT groups) */
    const addGroup=(label,list)=>{
      const og=document.createElement('optgroup'); og.label=label;
      list.forEach(n=>{
        if(!idx.maxC.get(n)) return;
        const opt=document.createElement('option'); opt.value=n; opt.textContent=n; og.appendChild(opt);
      });
      bSel.appendChild(og);
    };
    addGroup('Old Testament', OT);
    addGroup('New Testament', NT);
    bSel.value=state.book; ensureSel(bSel);

    /* Chapters */
    const maxC=idx.maxC.get(state.book)||1;
    for(let c=1;c<=maxC;c++){ const o=document.createElement('option'); o.value=c; o.textContent=c; cSel.appendChild(o); }
    cSel.value=String(state.chapter); ensureSel(cSel);

    /* Verses */
    const maxV=idx.maxV.get(keyBC(state.book,state.chapter))||1;
    for(let v=1;v<=maxV;v++){ const o=document.createElement('option'); o.value=v; o.textContent=v; vSel.appendChild(o); }
    vSel.value=String(state.verse); ensureSel(vSel);

    bSel.onchange = ()=>{ state.book=bSel.value; state.chapter=1; state.verse=1; render(true); };
    cSel.onchange = ()=>{ state.chapter=Number(cSel.value)||1; state.verse=1; render(true); };
    vSel.onchange = ()=>{ state.verse=Number(vSel.value)||1; state.view='verse'; localStorage.setItem('web_view','verse'); render(true); };
  }

  /* Search parsing */
  function canonName(s){
    if(!s) return '';
    let x = String(s).trim().toLowerCase()
      .replace(/[._-]+/g,' ')
      .replace(/[–—]/g,'-')
      .replace(/(\d)([a-z])/gi,'$1 $2')
      .replace(/([a-z])(\d)/gi,'$1 $2')
      .replace(/\s+/g,' ');
    x = x.replace(/^(first|1st|i)\b\s*/,'1 ')
         .replace(/^(second|2nd|ii)\b\s*/,'2 ')
         .replace(/^(third|3rd|iii)\b\s*/,'3 ');
    x = x.replace(/^psalm\b/,'psalms')
         .replace(/^(song of songs|canticles?)\b/,'song of solomon');
    return x;
  }
  function parseRefInput(s){
    if(!s) return null;
    s = canonName(s);
    const m = s.match(/^(.+?)\s+(\d+)\s*[:\s]\s*(\d+)\s*$/) || s.match(/^(.+?)\s+(\d+)\s*$/);
    if(!m) return null;
    const bookPart = m[1].replace(/\s+/g,' ');
    const chapter = parseInt(m[2],10);
    const verse = m[3] ? parseInt(m[3],10) : 1;

    /* map to a real book name */
    const exact = BOOKS.find(b=>canonName(b)===bookPart);
    if(exact) return { book:exact, chapter, verse };
    const starts = BOOKS.find(b=>canonName(b).startsWith(bookPart));
    if(starts) return { book:starts, chapter, verse };
    return null;
  }

  function refHash(o){ return `#${encodeURIComponent(o.book)}.${o.chapter}.${o.verse}`; }
  function fromHash(){
    if(!location.hash) return null;
    const raw=decodeURIComponent(location.hash.slice(1));
    const m=raw.match(/^(.+?)\.(\d+)\.(\d+)$/);
    if(!m) return null;
    return { book:m[1], chapter:Number(m[2]), verse:Number(m[3]) };
  }
  function shareUrls(refLabel, text){
    const url = CANON.origin + CANON.path + refHash(state);
    const title = encodeURIComponent(`The Holy Bible — ${refLabel}`);
    const body = encodeURIComponent(`${refLabel}: ${text}`.slice(0,250));
    return {
      facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
      x:        `https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${body}`,
      linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,
      email:    `mailto:?subject=${title}&body=${body}%0A%0A${encodeURIComponent(url)}`
    };
  }
  async function copyLink(){ const url = CANON.origin + CANON.path + refHash(state);
    try{ await navigator.clipboard.writeText(url); }catch(_){
      const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
  }
  function scrollToReaderTop(){ mount.scrollIntoView({behavior:'auto', block:'start'}); }

  /* Render */
  function render(pushHash){
    populateSelects();

    const refLabel = `${state.book} ${state.chapter}:${state.verse}`;
    $('#web-refline').textContent = refLabel;

    const list = idx.byBC.get(keyBC(state.book,state.chapter)) || [];
    const maxV = idx.maxV.get(keyBC(state.book,state.chapter)) || 1;
    const verse = Math.max(1, Math.min(maxV, state.verse));
    state.verse = verse;

    let html='';
    if(state.view==='chapter'){
      html = list.map(row=>`<span class="vnum">${row.v}</span> ${escapeHtml(row.t)}`).join(' ');
    }else{
      const node = list.find(r=>r.v===verse);
      html = `<span class="vnum">${verse}</span> ${escapeHtml(node? node.t : '(verse unavailable)')}`;
    }
    $('#web-text').innerHTML = html;

    /* font + view btn */
    setFont(state.fontRem);
    updateViewBtn();

    /* share hookups */
    const plainText = stripTags(html).replace(/^\d+\s+/, '');
    const links = shareUrls(refLabel, plainText);
    $('#share-fb').onclick = ()=>window.open(links.facebook,'_blank','noopener');
    $('#share-x').onclick  = ()=>window.open(links.x,'_blank','noopener');
    $('#share-ln').onclick = ()=>window.open(links.linkedin,'_blank','noopener');
    $('#share-email').onclick = ()=> location.href = links.email;
    $('#share-copy').onclick  = copyLink;

    /* hash */
    if(pushHash){ const h = refHash(state); if(location.hash!==h) history.replaceState(null,'',h); }

    /* bottom pager only for chapter view */
    const pager = $('#web-bottom-pager');
    const showPager = state.view==='chapter';
    pager.setAttribute('aria-hidden', showPager ? 'false' : 'true');
  }

  /* Step helpers */
  function stepVerse(delta){
    let b=state.book, c=state.chapter, v=state.verse;
    v+=delta;
    const maxV=idx.maxV.get(keyBC(b,c))||1;
    if(v<1){
      if(c>1){ c--; v = idx.maxV.get(keyBC(b,c))||1; }
      else{
        const bi = BOOKS.indexOf(b)-1;
        if(bi>=0){ b=BOOKS[bi]; c=idx.maxC.get(b)||1; v=idx.maxV.get(keyBC(b,c))||1; }
      }
    } else if(v>maxV){
      const maxC=idx.maxC.get(b)||c;
      if(c<maxC){ c++; v=1; }
      else{
        const bi = BOOKS.indexOf(b)+1;
        if(bi<BOOKS.length){ b=BOOKS[bi]; c=1; v=1; }
      }
    }
    state.book=b; state.chapter=c; state.verse=v;
    render(true);
  }
  function stepChapter(delta){
    let b=state.book, c=state.chapter;
    const maxC=idx.maxC.get(b)||1;
    c += delta;
    if(c<1){
      // stay in book (requirement: chapter pager moves one chapter, not to previous book)
      c=1;
    } else if(c>maxC){
      c=maxC;
    }
    state.chapter=c; state.verse=1;
    render(true);
    scrollToReaderTop();
  }

  /* Utilities */
  function stripTags(html){ const d=document.createElement('div'); d.innerHTML=html; return d.textContent||''; }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  /* Bind controls */
  function bindControls(){
    $('#web-go').onclick = ()=>{
      const r = parseRefInput($('#web-ref').value);
      if(r){ state.book=r.book; state.chapter=r.chapter; state.verse=r.verse; render(true); }
      else showError('Try formats like “Ps 23”, “Jn 3:16”, “1 Jn 1:9”, “Song 2:1”.');
    };
    $('#web-ref').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#web-go').click(); });

    $('#web-prev').onclick = ()=> stepVerse(-1);
    $('#web-next').onclick = ()=> stepVerse(1);

    $('#web-dice').onclick = ()=>{
      const avail = BOOKS.filter(b=>idx.maxC.get(b));
      const b = avail[Math.floor(Math.random()*avail.length)];
      const c = 1 + Math.floor(Math.random()*(idx.maxC.get(b)||1));
      const v = 1 + Math.floor(Math.random()*((idx.maxV.get(keyBC(b,c))||1)));
      state.view='verse'; localStorage.setItem('web_view','verse');
      state.book=b; state.chapter=c; state.verse=v; render(true);
    };

    $('#web-view').onclick = ()=>{
      state.view = (state.view==='verse') ? 'chapter' : 'verse';
      localStorage.setItem('web_view', state.view);
      updateViewBtn(); render(false);
    };

    $('#web-books').onclick = toggleTOC;
    $('#web-a-plus').onclick = ()=> setFont(state.fontRem + 0.06);
    $('#web-a-minus').onclick = ()=> setFont(state.fontRem - 0.06);

    $('#web-bottom-prev').onclick = ()=> stepChapter(-1);
    $('#web-bottom-next').onclick = ()=> stepChapter(1);

    window.addEventListener('hashchange', ()=>{
      const h = fromHash();
      if(h){ state.book=h.book; state.chapter=h.chapter; state.verse=h.verse; render(false); }
    });
  }

  function showError(msg){
    const box = el('div','web__error'); box.textContent = msg;
    mount.appendChild(box); setTimeout(()=> box.remove(), 4000);
  }

  /* Boot */
  (async function start(){
    try{
      const raw = await fetchData();
      const rows = flatten(raw);
      buildIndex(rows);

      /* start from hash or Genesis 1:1 */
      const h = fromHash();
      if(h){ state.book=h.book; state.chapter=h.chapter; state.verse=h.verse; }

      bindControls();
      render(true);
    }catch(e){
      console.error(e);
      showError('Startup error: '+(e && e.message ? e.message : e));
    }
  })();
})();
</script>
