<script>
(function(){
  const root = document.getElementById('lwb-esv-app');
  if(!root){ console.error('ESV root not found'); return; }
  const $ = (sel, r=root) => r.querySelector(sel);
  const el = (tag, cls) => { const e=document.createElement(tag); if(cls) e.className=cls; return e; };

  /* helper: scroll to top of reader (not page) */
  function scrollToReaderTop(){
    try{ root.scrollIntoView({behavior:'smooth', block:'start'}); }catch(_) {}
  }

  // ========================= CONFIG =========================
  const LOGO_URL = '/assets/LivingWordBibles01.png';
  const BASES = [
    'https://cdn.jsdelivr.net/gh/Living-Word-Bibles/Holy-Bible-Master@main/ESV/ESV_books/',
    'https://raw.githubusercontent.com/Living-Word-Bibles/Holy-Bible-Master/main/ESV/ESV_books/',
    'https://cdn.jsdelivr.net/gh/Living-Word-Bibles/Holy-Bible-Master@main/ESV/',
    'https://raw.githubusercontent.com/Living-Word-Bibles/Holy-Bible-Master/main/ESV/'
  ];
  const WHOLE_BIBLE_CANDIDATES = ['ESV.json','ESV_Bible.json','Bible.json'];
  const BOOKS_JSON_CANDIDATES = ['Books.json','books.json'];
  const cacheBust = '';
  let ACTIVE_BASE = null, HAS_BOOKS_JSON = false, WHOLE_BIBLE = null;

  const OT = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi'];
  const NT = ['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];

  // ====================== HELPERS ==========================
  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
  const slugify = name => String(name).trim().toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'-');
  const refToHash = r => `#/${r.bookSlug}/${r.chapter}/${r.verse}`;
  const absoluteVerseUrl = r => location.origin + location.pathname + refToHash(r);
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }

  async function fetchJSON(u){
    const r = await fetch(u, {cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status} @ ${u}`);
    const t = await r.text();
    try { return JSON.parse(t); } catch { throw new Error(`Non-JSON @ ${u}`); }
  }

  async function pickActiveBase(){
    if(ACTIVE_BASE) return ACTIVE_BASE;
    let lastErr = '';
    for(const base of BASES){
      try{
        for(const f of WHOLE_BIBLE_CANDIDATES){
          try{ const wb = await fetchJSON(base + f + cacheBust);
               if(wb && typeof wb==='object'){ WHOLE_BIBLE = wb; ACTIVE_BASE = base; HAS_BOOKS_JSON = false; return base; } }catch(_){}
        }
        for(const f of BOOKS_JSON_CANDIDATES){
          try{ const names = await fetchJSON(base + f + cacheBust);
               if(Array.isArray(names) && names.length){ ACTIVE_BASE = base; HAS_BOOKS_JSON = true; return base; } }catch(_){}
        }
        await fetchJSON(base + 'Genesis.json' + cacheBust);
        ACTIVE_BASE = base; HAS_BOOKS_JSON = false; return base;
      }catch(e){ lastErr = e.message; }
    }
    throw new Error('Could not locate ESV data. ' + (lastErr||'')); 
  }

  const Index = { list: null };
  const Books = new Map();

  async function loadIndex(){
    if(Index.list) return Index.list;
    const base = await pickActiveBase();
    if(HAS_BOOKS_JSON){
      for(const f of BOOKS_JSON_CANDIDATES){
        try{
          const names = await fetchJSON(base + f + cacheBust);
          if(Array.isArray(names) && names.length){
            Index.list = names.map(n => ({ name:n, slug:slugify(n) }));
            return Index.list;
          }
        }catch(_){}
      }
    }
    Index.list = [...OT, ...NT].map(n => ({ name:n, slug:slugify(n) }));
    return Index.list;
  }

  function synonymsForBook(name){
    const n = name.toLowerCase();
    if(n === 'psalms') return ['Psalms','Psalm','Psalter','Psa'];
    if(n === 'song of solomon') return ['Song of Solomon','Song of Songs','Canticles','Canticle of Canticles','Song','Songs','SoS'];
    const m = name.match(/^([123])\s+(.*)$/);
    if(m){
      const num = m[1], base = m[2];
      const roman = {1:'I',2:'II',3:'III'}[num];
      const word  = {1:'First',2:'Second',3:'Third'}[num];
      const ord   = {1:'1st',2:'2nd',3:'3rd'}[num];
      return [
        `${num} ${base}`, `${roman} ${base}`, `${word} ${base}`, `${ord} ${base}`,
        `${num}${base}`, `${roman}${base}`, `${word}${base}`, `${ord}${base}`,
        `${num}_${base.replace(/\s+/g,'_')}`, `${num}-${base.replace(/\s+/g,'-')}`
      ];
    }
    const rlead = name.match(/^(I{1,3})\s+(.*)$/i);
    if(rlead){ const map={i:'1',ii:'2',iii:'3'}; return [`${map[rlead[1].toLowerCase()]} ${rlead[2]}`, name]; }
    const wlead = name.match(/^(First|Second|Third)\s+(.*)$/i);
    if(wlead){ const map={first:'1',second:'2',third:'3'}; return [`${map[wlead[1].toLowerCase()]} ${wlead[2]}`, name]; }
    return [name];
  }

  function unwrapWholeBible(name, data){
    if(!data || typeof data!=='object' || Array.isArray(data)) return null;
    for(const candidate of synonymsForBook(name)){
      const norm = candidate.toLowerCase().replace(/\s+/g,'');
      const hit = Object.keys(data).find(k => k.toLowerCase().replace(/\s+/g,'') === norm);
      if(hit) return data[hit];
    }
    return null;
  }

  function toInt(x){ const n = Number(x); return Number.isFinite(n) ? n : null; }
  function isNumKeyObj(o){
    if(!o || typeof o!=='object' || Array.isArray(o)) return false;
    const ks = Object.keys(o);
    return ks.length && ks.every(k => /^\d+$/.test(String(k)));
  }

  function addChapterFromArray(out, chNum, arr){
    const vmap = {};
    arr.forEach((v,i)=>{
      if(v && typeof v === 'object'){
        const vn = toInt(v.verse || v.v || v.num || v.n || v.Verse) || (i+1);
        vmap[String(vn)] = String(v.text || v.t || v.Text || v.value || v.content || v.Content || '');
      } else { vmap[String(i+1)] = String(v ?? ''); }
    });
    out.chapters[chNum] = { verseCount:Object.keys(vmap).length, verses:vmap };
  }
  function addChapterFromObject(out, chNum, obj){
    const vmap = {};
    for(const [k,v] of Object.entries(obj)){
      const vn = toInt(k) || 0;
      vmap[String(vn)] = String((v && typeof v==='object') ? (v.text || v.t || v.value || v.Text || '') : (v ?? ''));
    }
    out.chapters[chNum] = { verseCount:Object.keys(vmap).length, verses:vmap };
  }

  function deepFindChapterMap(data){
    const seen = new Set(), q=[data];
    const IGNORE = new Set(['info','meta','copyright','license','book','bookname','name','translation','version','abbrev','abbr']);
    while(q.length){
      const cur = q.shift();
      if(!cur || typeof cur!=='object' || seen.has(cur)) continue;
      seen.add(cur);
      const keys = Object.keys(cur);
      const num = keys.filter(k=>/^\d+$/.test(k));
      if(keys.length && num.length/keys.length > 0.6) return cur;
      for(const k of keys){
        if(IGNORE.has(String(k).toLowerCase())) continue;
        const v = cur[k];
        if(v && typeof v==='object') q.push(v);
      }
    }
    return null;
  }

  function normalizeBook(name, data){
    const peeled = unwrapWholeBible(name, data);
    if(peeled) data = peeled;

    const out = { name, chapters:{} };

    const flat = data && (data.verses || data.Verses || data.content || data.Content || data.data);
    if(Array.isArray(flat)){
      for(const v of flat){
        const ch = toInt(v.chapter || v.c || v.ch || v.Chapter) || 1;
        const vn = toInt(v.verse || v.v || v.Verse || v.num || v.n) || 1;
        const txt = String(v.text || v.t || v.Text || v.value || v.content || v.Content || '');
        if(!out.chapters[ch]) out.chapters[ch] = { verseCount:0, verses:{} };
        out.chapters[ch].verses[String(vn)] = txt;
      }
      for(const ch of Object.keys(out.chapters)) out.chapters[ch].verseCount = Object.keys(out.chapters[ch].verses).length;
      return out;
    }

    const chs = data && (data.chapters || data.Chapters || data.chapter || data.Chapter);
    if(chs){
      if(Array.isArray(chs)){
        for(const entry of chs){
          const chNum = toInt(entry?.chapter || entry?.Chapter) || (Object.keys(out.chapters).length+1);
          const verses = entry?.verses || entry?.Verses || entry?.verse || entry?.Verse || entry;
          if(Array.isArray(verses)) addChapterFromArray(out, chNum, verses);
          else if(isNumKeyObj(verses)) addChapterFromObject(out, chNum, verses);
          else if(verses && typeof verses==='object' && (Array.isArray(verses.verses) || isNumKeyObj(verses.verses))){
            if(Array.isArray(verses.verses)) addChapterFromArray(out, chNum, verses.verses);
            else addChapterFromObject(out, chNum, verses.verses);
          }
        }
        if(Object.keys(out.chapters).length) return out;
      } else if(isNumKeyObj(chs)){
        for(const [chKey, val] of Object.entries(chs)){
          const chNum = toInt(chKey) || 1;
          if(Array.isArray(val)) addChapterFromArray(out, chNum, val);
          else if(isNumKeyObj(val)) addChapterFromObject(out, chNum, val);
        }
        if(Object.keys(out.chapters).length) return out;
      }
    }

    if(isNumKeyObj(data)){
      for(const [chKey, val] of Object.entries(data)){
        const chNum = toInt(chKey) || 1;
        if(Array.isArray(val)) addChapterFromArray(out, chNum, val);
        else if(isNumKeyObj(val)) addChapterFromObject(out, chNum, val);
      }
      if(Object.keys(out.chapters).length) return out;
    }
    const chapMap = data && typeof data==='object' ? deepFindChapterMap(data) : null;
    if(chapMap){
      for(const [chKey, val] of Object.entries(chapMap)){
        const chNum = toInt(chKey) || 1;
        if(Array.isArray(val)) addChapterFromArray(out, chNum, val);
        else if(isNumKeyObj(val)) addChapterFromObject(out, chNum, val);
      }
      if(Object.keys(out.chapters).length) return out;
    }

    console.warn('normalizeBook(): Unrecognized structure for', name, 'Keys:', Object.keys(data||{}));
    throw new Error('Unrecognized book JSON structure.');
  }

  function altFilenames(name){
    const ORDER = [...OT, ...NT].reduce((m,n,i)=>{m[n]=i+1; return m;}, {});
    const ord = ORDER[name] || 0;
    const nn = String(ord).padStart(2,'0');
    const nospc = name.replace(/\s+/g,'');
    const under = name.replace(/\s+/g,'_');
    const hyph  = name.replace(/\s+/g,'-');

    const specials = [];
    if(name === 'Psalms'){
      specials.push('Psalms.json','Psalm.json','Psa.json','Psalter.json','Book_of_Psalms.json','psalms.json','PSALMS.json');
    }
    if(name === 'Song of Solomon'){
      specials.push('SongofSolomon.json','SongOfSolomon.json','Song-of-Solomon.json',
                    'SongofSongs.json','SongOfSongs.json','Song_of_Songs.json',
                    'Canticles.json','CanticleofCanticles.json','Canticle_of_Canticles.json',
                    'Song.json','Songs.json');
    }

    const numMatch = name.match(/^([123])\s+(.*)$/);
    const numeric = [];
    if(numMatch){
      const d = numMatch[1], base = numMatch[2];
      const baseNo = base.replace(/\s+/g,'');
      const baseU = base.replace(/\s+/g,'_');
      const baseH = base.replace(/\s+/g,'-');
      const r = {1:'I',2:'II',3:'III'}[d];
      const w = {1:'First',2:'Second',3:'Third'}[d];
      const o = {1:'1st',2:'2nd',3:'3rd'}[d];
      numeric.push(
        `${d}${baseNo}.json`, `${d}_${baseU}.json`, `${d}-${baseH}.json`, `${d} ${base}.json`,
        `${r}${baseNo}.json`, `${r}_${baseU}.json`, `${r}-${baseH}.json`, `${r} ${base}.json`,
        `${w}${baseNo}.json`, `${w}_${baseU}.json`, `${w}-${baseH}.json`, `${w} ${base}.json`,
        `${o}${baseNo}.json`, `${o}_${baseU}.json`, `${o}-${baseH}.json`, `${o} ${base}.json`,
        `${d}${baseNo}.JSON`
      );
    }

    const alts = new Set([
      ...specials,
      ...numeric,
      nospc + '.json', under + '.json', hyph + '.json',
      nospc + '.JSON',
      `${nn}_${name.replace(/^[123]\s+/,'').replace(/\s+/g,'_')}.json`,
      ...WHOLE_BIBLE_CANDIDATES
    ]);

    const more = [];
    for(const f of alts){ if(/\s/.test(f)) more.push(encodeURI(f)); }
    more.forEach(f => alts.add(f));

    return Array.from(alts);
  }

  async function loadBook(slug){
    if(Books.has(slug)) return Books.get(slug);
    const idx = await loadIndex();
    const row = idx.find(b=>b.slug===slug);
    if(!row) throw new Error(`Book not found for slug ${slug}`);

    let raw = null;

    if(WHOLE_BIBLE){
      raw = unwrapWholeBible(row.name, WHOLE_BIBLE);
      if(raw){ const norm = normalizeBook(row.name, raw); Books.set(slug, norm); return norm; }
    }

    for(const base of BASES){
      for(const fname of altFilenames(row.name)){
        try{ raw = await fetchJSON(base + fname + cacheBust); if(raw) break; }catch(_){}
      }
      if(raw) break;
    }

    if(!raw){
      for(const base of BASES){
        for(const f of WHOLE_BIBLE_CANDIDATES){
          try{ const wb = await fetchJSON(base + f + cacheBust);
               if(wb && typeof wb==='object'){ WHOLE_BIBLE = wb; raw = unwrapWholeBible(row.name, wb); if(raw) break; } }catch(_){}
        }
        if(raw) break;
      }
    }

    if(!raw){ throw new Error(`Could not load data for ${row.name}.`); }

    const norm = normalizeBook(row.name, raw);
    Books.set(slug, norm);
    return norm;
  }

  function canonName(s){
    if(!s) return '';
    var x = String(s).trim().toLowerCase();
    x = x.replace(/[._-]+/g,' ').replace(/\s+/g,' ');
    x = x.replace(/^(first|1st|i)\b\s*/i,'1 ')
         .replace(/^(second|2nd|ii)\b\s*/i,'2 ')
         .replace(/^(third|3rd|iii)\b\s*/i,'3 ');
    x = x.replace(/^psalm\b/,'psalms')
         .replace(/^(song of songs|canticles?)\b/,'song of solomon');
    return x.replace(/\s+/g,'');
  }

  function findBookSlug(bookPart, idx){
    const t = canonName(bookPart);
    let row = idx.find(b => canonName(b.name) === t);
    if(row) return row.slug;
    row = idx.find(b => canonName(b.name).startsWith(t));
    if(row) return row.slug;
    const mapped = ALIAS_TO_NAME[t] || ALIAS_TO_NAME[t.replace(/\s/g,'')];
    if(mapped){ row = idx.find(b => b.name.toLowerCase() === mapped.toLowerCase()); if(row) return row.slug; }
    const m = t.match(/^([123])(.*)$/);
    if(m){
      const mappedBase = ALIAS_TO_NAME[m[2]];
      if(mappedBase){
        const target = `${m[1]} ${mappedBase}`;
        row = idx.find(b => b.name.toLowerCase() === target.toLowerCase());
        if(row) return row.slug;
      }
    }
    if(mapped){
      row = idx.find(b => canonName(b.name).startsWith(canonName(mapped)));
      if(row) return row.slug;
    }
    return null;
  }

  function parseInput(input, idx){
    if(!input) return null;
    let s = String(input).trim().toLowerCase()
      .replace(/[–—]/g,'-')
      .replace(/(\d)([a-z])/gi,'$1 $2')
      .replace(/([a-z])(\d)/gi,'$1 $2');
    s = s.replace(/[.,;]+/g,' ');
    s = s.replace(/\bco\b/g,'cor');

    let m = s.match(/^(.+?)\s+(\d+)\s*[:\s]\s*(\d+)\s*$/i) || s.match(/^(.+?)\s+(\d+)\s*$/i);
    if(!m) return null;
    const namePart = m[1];
    const chapter = parseInt(m[2],10);
    const verse = m[3] ? parseInt(m[3],10) : 1;
    const slug = findBookSlug(namePart, idx);
    return slug ? { bookSlug: slug, chapter, verse } : null;
  }

  function toggleTOC(){

  async function buildTOC(){
    const wrap = $('#esv-toc-inner');
    const idx = await loadIndex();
    wrap.innerHTML = '';
    idx.forEach(({name,slug})=>{
      const a = el('a'); a.href = 'javascript:void(0)'; a.textContent = name;
      a.addEventListener('click', async ()=>{
        try{
          const b = await loadBook(slug);
          const firstCh = Math.min(...Object.keys(b.chapters).map(Number));
          state.passage = { bookSlug: slug, chapter: firstCh, verse: 1 };
          toggleTOC(); render();
        }catch(e){ showInlineError(`Could not open ${name}.`); }
      });
      wrap.appendChild(a);
    });
  }

  // ======================== RENDER =========================
  let state = {

  function setFont(val){ val=Math.max(0.9,Math.min(1.6,val)); state.font=val; localStorage.setItem('esv_font', String(val)); const t=$('#esv-text'); if(t) t.style.fontSize = val + 'rem'; }
  function updateViewButton(){ $('#esv-view').textContent = (state.view==='verse') ? 'Verse ▾' : 'Chapter ▴'; }

  function populateBookSelect(idx){
    const sel = $('#esv-select'); if(!sel) return;
    sel.innerHTML = '';
    const addGroup = (label, list)=>{
      const og = document.createElement('optgroup'); og.label = label;
      list.forEach(n=>{
        const row = idx.find(b=>b.name===n);
        if(row){
          const opt=document.createElement('option');
          opt.value=row.slug; opt.textContent=row.name;
          og.appendChild(opt);
        }
      });
      sel.appendChild(og);
    };
    addGroup('Old Testament', OT);
    addGroup('New Testament', NT);
  }

  function populateVerseSelect(book, chapter){
    const sel = $('#esv-verse'); if(!sel) return;
    const ch = book.chapters[chapter];
    const count = ch?.verseCount || 1;
    const current = state.passage.verse || 1;
    sel.innerHTML = Array.from({length:count}, (_,i)=>`<option value="${i+1}"${i+1===current?' selected':''}>${i+1}</option>`).join('');
    sel.onchange = ()=>{ state.passage.verse = parseInt(sel.value,10)||1; state.view='verse'; localStorage.setItem('esv_view','verse'); render(); };
  }

  function hashToRef(){
    const h = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    return (h.length>=3)?{bookSlug:h[0],chapter:+h[1],verse:+h[2]}:{bookSlug:'genesis',chapter:1,verse:1};
  }

  function updateShareLinks(ref, bookName, verseText){
    const links = shareUrls(ref, bookName, verseText);
    $('#share-fb').onclick = ()=>window.open(links.facebook, '_blank', 'noopener');
    $('#share-x').onclick = ()=>window.open(links.x, '_blank', 'noopener');
    $('#share-ln').onclick = ()=>window.open(links.linkedin, '_blank', 'noopener');
    $('#share-email').onclick = ()=>{ location.href = links.email; };
    $('#share-copy').onclick = ()=>copyLink(ref);

  async function render(){
    const idx = await loadIndex();
    if(!state.passage) state.passage = hashToRef();
    const current = idx.find(b=>b.slug===state.passage.bookSlug) || idx[0];

    root.innerHTML = appTemplate();

    const jumpErr = 'Try formats like “1 Jn 1:9”, “2 Pet 3”, “Ps 23”, “Song 2:1”, or “1 Co 13”.';
    $('#esv-go').addEventListener('click', ()=>{ const r = parseInput($('#esv-passage').value, idx); if(r){ state.passage=r; render(); } else { showInlineError(jumpErr); }});
    $('#esv-passage').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const r=parseInput(e.target.value, idx); if(r){ state.passage=r; render(); } else { showInlineError(jumpErr); }}});

    $('#esv-books').addEventListener('click', toggleTOC);
    $('#esv-view').addEventListener('click', ()=>{ state.view = (state.view==='verse')?'chapter':'verse'; localStorage.setItem('esv_view', state.view); updateViewButton(); render(); });
    $('#esv-a-plus').addEventListener('click', ()=> setFont(state.font + 0.06));
    $('#esv-a-minus').addEventListener('click', ()=> setFont(state.font - 0.06));

    populateBookSelect(idx);
    const bookSel = $('#esv-select');
    bookSel.value = current.slug;
    bookSel.onchange = (e)=>{ state.passage = { bookSlug:e.target.value, chapter:1, verse:1 }; render(); };

    let book;
    try{ book = await loadBook(current.slug); }
    catch(e){ showInlineError(e.message); return; }

    if(!book.chapters[state.passage.chapter]){
      const firstCh = Math.min(...Object.keys(book.chapters).map(Number));
      state.passage.chapter = firstCh; state.passage.verse=1;
    }

    const ch = book.chapters[state.passage.chapter];
    populateVerseSelect(book, state.passage.chapter);

    const verseText = (state.view==='chapter')
      ? Object.entries(ch.verses).map(([i,t])=>`<span class="vnum">${i}</span> ${escapeHtml(t)}`).join(' ')
      : escapeHtml(ch.verses[String(clamp(state.passage.verse,1,ch.verseCount||1))]||'(Verse not found.)');

    $('.esv__ref').textContent = `${book.name} ${state.passage.chapter}:${state.passage.verse}`;
    $('#esv-text').innerHTML = (state.view==='chapter') ? verseText : `<span class="verse">${verseText}</span>`;

    updateViewButton(); setFont(state.font);
    updateShareLinks(state.passage, book.name, $('.verse')?.textContent || '');

    const newHash = refToHash(state.passage); if(location.hash !== newHash) history.replaceState(null, '', newHash);

    const doPrev = async ()=>{ state.passage = (state.view==='chapter') ? await stepPrevChapter(state.passage) : await stepPrevVerse(state.passage); render(); scrollToReaderTop(); };
    const doNext = async ()=>{ state.passage = (state.view==='chapter') ? await stepNextChapter(state.passage) : await stepNextVerse(state.passage); render(); scrollToReaderTop(); };
    $('#esv-prev').addEventListener('click', doPrev);
    $('#esv-next').addEventListener('click', doNext);

    const pager = $('#esv-bottom-pager');
    const showPager = state.view === 'chapter';
    pager.setAttribute('aria-hidden', showPager ? 'false' : 'true');
    $('#esv-bottom-prev').onclick = async ()=>{ state.passage = await stepPrevChapter(state.passage); render(); scrollToReaderTop(); };
    $('#esv-bottom-next').onclick = async ()=>{ state.passage = await stepNextChapter(state.passage); render(); scrollToReaderTop(); };

    const rollDice = async ()=>{
      try{
        const idxList = await loadIndex();
        const row = idxList[Math.floor(Math.random()*idxList.length)];
        const b = await loadBook(row.slug);
        const chNums = Object.keys(b.chapters).map(Number);
        if(!chNums.length) throw new Error('No chapters available for random selection.');
        const chn = chNums[Math.floor(Math.random()*chNums.length)];
        const vc = Math.max(1, b.chapters[chn]?.verseCount || 1);
        const vs = 1 + Math.floor(Math.random()*vc);
        state.view = 'verse'; localStorage.setItem('esv_view','verse');
        state.passage = { bookSlug: row.slug, chapter: chn, verse: vs };
        render(); scrollToReaderTop();
      }catch(e){
        showInlineError('Random verse failed: ' + (e && e.message ? e.message : 'Unknown error'));
      }
    };
    $('#esv-dice').addEventListener('click', rollDice);
    window.addEventListener('keydown', (e)=>{ if(e.key && e.key.toLowerCase()==='r') rollDice(); });

    window.onkeydown = async (e)=>{ if(e.key==='ArrowLeft') doPrev(); if(e.key==='ArrowRight') doNext(); };
  }

  function nextBookSlug(slug){ const list = Index.list; const i = list.findIndex(b=>b.slug===slug); return (i>=0 && i<list.length-1) ? list[i+1].slug : slug; }
  function prevBookSlug(slug){ const list = Index.list; const i = list.findIndex(b=>b.slug===slug); return (i>0) ? list[i-1].slug : slug; }

  async function stepNextVerse(ref){
    const book = await loadBook(ref.bookSlug);
    const ch = book.chapters[ref.chapter];
    if(ch && ref.verse < ch.verseCount) return { ...ref, verse: ref.verse+1 };
    const chNums = Object.keys(book.chapters).map(Number).sort((a,b)=>a-b);
    const i = chNums.indexOf(ref.chapter);
    if(i>=0 && i<chNums.length-1) return { bookSlug: ref.bookSlug, chapter: chNums[i+1], verse: 1 };
    const nbSlug = nextBookSlug(ref.bookSlug); const nb = await loadBook(nbSlug);
    const nbFirst = Math.min(...Object.keys(nb.chapters).map(Number));
    return { bookSlug: nbSlug, chapter: nbFirst, verse: 1 };
  }
  async function stepPrevVerse(ref){
    if(ref.verse > 1) return { ...ref, verse: ref.verse-1 };
    const book = await loadBook(ref.bookSlug);
    const chNums = Object.keys(book.chapters).map(Number).sort((a,b)=>a-b);
    const i = chNums.indexOf(ref.chapter);
    if(i>0){ const prevCh = chNums[i-1]; const vc = book.chapters[prevCh].verseCount || 1; return { bookSlug: ref.bookSlug, chapter: prevCh, verse: vc }; }
    const pbSlug = prevBookSlug(ref.bookSlug); const pb = await loadBook(pbSlug);
    const lastCh = Math.max(...Object.keys(pb.chapters).map(Number));
    const lastVc = pb.chapters[lastCh].verseCount || 1;
    return { bookSlug: pbSlug, chapter: lastCh, verse: lastVc };
  }
  async function stepNextChapter(ref){
    const book = await loadBook(ref.bookSlug);
    const chNums = Object.keys(book.chapters).map(Number).sort((a,b)=>a-b);
    const i = chNums.indexOf(ref.chapter);
    if(i>=0 && i<chNums.length-1) return { bookSlug: ref.bookSlug, chapter: chNums[i+1], verse: 1 };
    const nbSlug = nextBookSlug(ref.bookSlug); const nb = await loadBook(nbSlug);
    const nbFirst = Math.min(...Object.keys(nb.chapters).map(Number));
    return { bookSlug: nbSlug, chapter: nbFirst, verse: 1 };
  }
  async function stepPrevChapter(ref){
    const book = await loadBook(ref.bookSlug);
    const chNums = Object.keys(book.chapters).map(Number).sort((a,b)=>a-b);
    const i = chNums.indexOf(ref.chapter);
    if(i>0){ const prevCh = chNums[i-1]; return { bookSlug: ref.bookSlug, chapter: prevCh, verse: 1 }; }
    const pbSlug = prevBookSlug(ref.bookSlug); const pb = await loadBook(pbSlug);
    const lastCh = Math.max(...Object.keys(pb.chapters).map(Number));
    return { bookSlug: pbSlug, chapter: lastCh, verse: 1 };
  }
