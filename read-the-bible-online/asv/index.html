<style>

<script>
(function(){
  const root = document.getElementById('lwb-asv-app');
  if(!root){ console.error('ASV root not found'); return; }
  const $ = (sel, r=root) => r.querySelector(sel);
  const el = (tag, cls) => { const e=document.createElement(tag); if(cls) e.className=cls; return e; };

  // ========================= CONFIG =========================
  const LOGO_URL = '/assets/LivingWordBibles01.png';

  // Pinned ASV JSON (rows/chapters; robust flattener below handles shapes)
  const DATA_URLS = [
    'https://cdn.jsdelivr.net/gh/jadenzaleski/bible-translations@86d528c69b5bbcca9ce0dc0b17b037c1128c6651/ASV/ASV_bible.json',
    'https://raw.githubusercontent.com/jadenzaleski/bible-translations/86d528c69b5bbcca9ce0dc0b17b037c1128c6651/ASV/ASV_bible.json'
  ];

  const OT = ['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi'];
  const NT = ['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
  const BOOKS = [...OT, ...NT];
  const ORDER = BOOKS.reduce((m,n,i)=>{m[n]=i+1; return m;}, {});

  // ====================== HELPERS ==========================
  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
  const slugify = name => String(name).trim().toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'-');
  const refToHash = r => `#/${encodeURIComponent(r.book)}/${r.chapter}/${r.verse}`;
  const absoluteVerseUrl = r => location.origin + location.pathname + refToHash(r);
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }
  function scrollToReaderTop(){ try{ root.scrollIntoView({behavior:'instant', block:'start'}); }catch(_){} }

  async function fetchJSON(u){
    const r = await fetch(u, {cache:'force-cache'});
    if(!r.ok) throw new Error(`HTTP ${r.status} @ ${u}`);
    return await r.json();
  }

  // Normalizes book names, including Psalm/Psalms/Psalter -> Psalms
  function normalizeBookName(s){
    if(s==null) return '';
    let name = String(s).trim();
    // Handle numeric-first variants (I/II/III, First/Second/Third)
    name = name.replace(/^(First|1st|I)\b[\s_-]*/i,'1 ')
               .replace(/^(Second|2nd|II)\b[\s_-]*/i,'2 ')
               .replace(/^(Third|3rd|III)\b[\s_-]*/i,'3 ');
    // Psalms variants
    const low = name.toLowerCase().replace(/\s+/g,' ');
    if(low === 'psalm' || low === 'psalms' || low === 'psalter') return 'Psalms';
    if(low.startsWith('song of songs') || low.startsWith('canticles')) return 'Song of Solomon';
    return name.replace(/\s+/g,' ').replace(/\bof\b/gi,'of');
  }

  // Robust flattener: returns rows = [{book,chapter,verse,text}]
  function flattenBibleJSON(input){
    const rows=[];
    function pushRow(b,c,v,t){ rows.push({book:normalizeBookName(b),chapter:Number(c),verse:Number(v),text:String(t??'').trim()}); }

    if(Array.isArray(input)){
      const sample=input[0]||{};
      const keys = {book:['book','book_name','name','title','b'], chap:['chapter','chapter_num','c','chap','number'], verse:['verse','verse_num','v','num','id'], text:['text','content','verse_text','t','body','value']};
      const pick = (o, arr)=> arr.find(k=>k in o);
      const B=pick(sample,keys.book), C=pick(sample,keys.chap), V=pick(sample,keys.verse), T=pick(sample,keys.text);
      if(B&&C&&V&&T){
        for(const r of input){ pushRow(r[B], r[C], r[V], r[T]); }
        return rows;
      }
    }
    if(input && Array.isArray(input.books)){
      input.books.forEach((b,bi)=>{
        const bname = normalizeBookName(b.name||b.title||BOOKS[bi]||'');
        const chs = b.chapters||b.Chapters||[];
        chs.forEach((c,ci)=>{
          const cnum = Number(c.chapter||c.number||ci+1);
          const vs = c.verses||c.Verses||[];
          vs.forEach((v,vi)=>{
            if(typeof v==='string'){ pushRow(bname,cnum,vi+1,v); }
            else if(v){ pushRow(bname,cnum, v.verse||v.number||vi+1, v.text||v.content||v.verse_text||''); }
          });
        });
      });
      return rows;
    }
    if(input && typeof input==='object'){
      for(const bk of Object.keys(input)){
        const bname = normalizeBookName(bk);
        const chs = input[bk];
        if(!chs || typeof chs!=='object') continue;
        for(const ch of Object.keys(chs)){
          const cnum = Number(ch);
          const vobj = chs[ch];
          if(typeof vobj!=='object') continue;
          for(const vs of Object.keys(vobj)){
            pushRow(bname,cnum,Number(vs), vobj[vs]);
          }
        }
      }
      if(rows.length) return rows;
    }
    throw new Error('Unsupported JSON shape for ASV data.');
  }

  // Build structured book -> chapters -> verses
  function buildBookMap(rows){
    const byBook = new Map();
    for(const r of rows){
      if(!BOOKS.includes(r.book)) continue; // ignore non-canon or unrecognized
      if(!byBook.has(r.book)) byBook.set(r.book, { name:r.book, slug:slugify(r.book), chapters:{} });
      const book = byBook.get(r.book);
      if(!book.chapters[r.chapter]) book.chapters[r.chapter] = { verseCount:0, verses:{} };
      book.chapters[r.chapter].verses[String(r.verse)] = r.text;
      book.chapters[r.chapter].verseCount = Math.max(book.chapters[r.chapter].verseCount, r.verse);
    }
    return byBook;
  }

  // ========================= SEARCH ========================
  const ALIAS_TO_NAME = {
    ge:'Genesis', gen:'Genesis', gn:'Genesis',
    ex:'Exodus', exo:'Exodus', exod:'Exodus',
    lev:'Leviticus', lv:'Leviticus',
    nu:'Numbers', num:'Numbers', nm:'Numbers',
    dt:'Deuteronomy', deut:'Deuteronomy',
    jos:'Joshua', josh:'Joshua',
    jdg:'Judges', judg:'Judges',
    ru:'Ruth', rut:'Ruth',
    '1sa':'1 Samuel','1sam':'1 Samuel','1sm':'1 Samuel','i sam':'1 Samuel','firstsamuel':'1 Samuel','1s':'1 Samuel',
    '2sa':'2 Samuel','2sam':'2 Samuel','2sm':'2 Samuel','ii sam':'2 Samuel','secondsamuel':'2 Samuel','2s':'2 Samuel',
    '1ki':'1 Kings','1kgs':'1 Kings','i ki':'1 Kings','firstkings':'1 Kings',
    '2ki':'2 Kings','2kgs':'2 Kings','ii ki':'2 Kings','secondkings':'2 Kings',
    '1ch':'1 Chronicles','1chr':'1 Chronicles','i ch':'1 Chronicles','firstchronicles':'1 Chronicles',
    '2ch':'2 Chronicles','2chr':'2 Chronicles','ii ch':'2 Chronicles','secondchronicles':'2 Chronicles',
    ezr:'Ezra', neh:'Nehemiah', est:'Esther', job:'Job',
    ps:'Psalms', psa:'Psalms', pss:'Psalms', pslm:'Psalms', pslms:'Psalms', psalm:'Psalms', psalms:'Psalms', psalter:'Psalms',
    pr:'Proverbs', prov:'Proverbs',
    ec:'Ecclesiastes', ecc:'Ecclesiastes', eccl:'Ecclesiastes', qoh:'Ecclesiastes',
    sos:'Song of Solomon', song:'Song of Solomon', songs:'Song of Solomon', cant:'Song of Solomon', canticles:'Song of Solomon',
    isa:'Isaiah', jer:'Jeremiah', lam:'Lamentations', eze:'Ezekiel', ezk:'Ezekiel', dan:'Daniel',
    hos:'Hosea', jl:'Joel', am:'Amos', ob:'Obadiah', jon:'Jonah',
    mic:'Micah', nah:'Nahum', hab:'Habakkuk', zep:'Zephaniah', zeph:'Zephaniah', hag:'Haggai', zec:'Zechariah', zech:'Zechariah', mal:'Malachi',
    mt:'Matthew', matt:'Matthew',
    mk:'Mark', mrk:'Mark',
    lk:'Luke', luk:'Luke',
    jn:'John', joh:'John', jhn:'John',
    act:'Acts', acts:'Acts',
    rom:'Romans', ro:'Romans',
    '1co':'1 Corinthians','1cor':'1 Corinthians','i co':'1 Corinthians','firstcorinthians':'1 Corinthians',
    '2co':'2 Corinthians','2cor':'2 Corinthians','ii co':'2 Corinthians','secondcorinthians':'2 Corinthians',
    ga:'Galatians', gal:'Galatians', eph:'Ephesians',
    php:'Philippians', phil:'Philippians', col:'Colossians',
    '1th':'1 Thessalonians','1thes':'1 Thessalonians','1thess':'1 Thessalonians','firstthessalonians':'1 Thessalonians',
    '2th':'2 Thessalonians','2thes':'2 Thessalonians','2thess':'2 Thessalonians','secondthessalonians':'2 Thessalonians',
    '1ti':'1 Timothy','1tim':'1 Timothy','firsttimothy':'1 Timothy',
    '2ti':'2 Timothy','2tim':'2 Timothy','secondtimothy':'2 Timothy',
    tit:'Titus', phm:'Philemon', heb:'Hebrews', jas:'James',
    '1pe':'1 Peter','1pet':'1 Peter','firstpeter':'1 Peter',
    '2pe':'2 Peter','2pet':'2 Peter','secondpeter':'2 Peter',
    '1jn':'1 John','1john':'1 John','firstjohn':'1 John',
    '2jn':'2 John','2john':'2 John','secondjohn':'2 John',
    '3jn':'3 John','3john':'3 John','thirdjohn':'3 John',
    jud:'Jude',
    rev:'Revelation', re:'Revelation', apoc:'Revelation', apocalypse:'Revelation'
  };

  function canonName(s){
    if(!s) return '';
    var x = String(s).trim().toLowerCase();
    x = x.replace(/[._-]+/g,' ').replace(/\s+/g,' ');
    x = x.replace(/^(first|1st|i)\b\s*/i,'1 ')
         .replace(/^(second|2nd|ii)\b\s*/i,'2 ')
         .replace(/^(third|3rd|iii)\b\s*/i,'3 ');
    x = x.replace(/^psalm\b/,'psalms')
         .replace(/^psalter\b/,'psalms')
         .replace(/^(song of songs|canticles?)\b/,'song of solomon');
    return x.replace(/\s+/g,'');
  }

  function findBookName(bookPart){
    const t = canonName(bookPart);
    // Exact
    let row = BOOKS.find(b => canonName(b) === t);
    if(row) return row;
    // Starts-with
    row = BOOKS.find(b => canonName(b).startsWith(t));
    if(row) return row;
    // Alias map
    const mapped = ALIAS_TO_NAME[t] || ALIAS_TO_NAME[t.replace(/\s/g,'')];
    if(mapped) return mapped;
    const m = t.match(/^([123])(.*)$/);
    if(m){
      const mappedBase = ALIAS_TO_NAME[m[2]];
      if(mappedBase) return `${m[1]} ${mappedBase}`;
    }
    return null;
  }

  function parseInput(input){
    if(!input) return null;
    let s = String(input).trim().toLowerCase()
      .replace(/[–—]/g,'-')
      .replace(/(\d)([a-z])/gi,'$1 $2')
      .replace(/([a-z])(\d)/gi,'$1 $2');
    s = s.replace(/[.,;]+/g,' ');
    s = s.replace(/\bco\b/g,'cor'); // "1 co 13" -> "1 cor 13"

    let m = s.match(/^(.+?)\s+(\d+)\s*[:\s]\s*(\d+)\s*$/i) || s.match(/^(.+?)\s+(\d+)\s*$/i);
    if(!m) return null;
    const namePart = m[1];
    const chapter = parseInt(m[2],10);
    const verse = m[3] ? parseInt(m[3],10) : 1;
    const bookName = findBookName(namePart);
    return bookName ? { book: bookName, chapter, verse } : null;
  }

  // ====================== UI ===========================
  function appTemplate(){
    return `
      <div class="asv__head">
        <div class="asv__brand">
          <img class="asv__logo" alt="Living Word Bibles" src="${LOGO_URL}" loading="lazy" decoding="async"/>
          <div class="asv__title">The Holy Bible</div>
          <div class="asv__subtitle">American Standard Version</div>
        </div>
        <div class="asv__controls">
          <label class="sr-only" for="asv-passage">Passage</label>
          <input id="asv-passage" class="asv__input" type="text" placeholder="e.g., Ps 23, Psalm 23:1, 1 Co 13, Song 2:1" aria-label="Jump"/>
          <button id="asv-go" class="asv__btn" type="button" title="Go">Go</button>

          <select id="asv-verse" class="asv__select-verse" aria-label="Select verse"></select>
          <select id="asv-select" class="asv__select" aria-label="Select book"></select>

          <button id="asv-prev" class="asv__btn" type="button" title="Previous Chapter">◀</button>
          <button id="asv-next" class="asv__btn" type="button" title="Next Chapter">▶</button>

          <button id="asv-dice" class="asv__btn asv__dice" type="button" title="Random verse" aria-label="Random verse">
            <span class="pip pip-1"></span><span class="pip pip-2"></span><span class="pip pip-3"></span>
            <span class="pip pip-4"></span><span class="pip pip-5"></span><span class="pip pip-6"></span>
          </button>

          <div class="asv__sep" role="separator"></div>
          <button id="asv-view" class="asv__btn" type="button" title="Toggle Verse/Chapter view">Verse ▾</button>
          <div class="asv__sep" role="separator"></div>
          <button id="asv-books" class="asv__btn" type="button" title="Books">Books</button>
        </div>
      </div>

      <!-- Inline TOC -->
      <aside id="asv-toc" class="asv__toc" aria-hidden="true" aria-label="Books">
        <div class="asv__toc-title">Books</div>
        <div id="asv-toc-inner" class="asv__toc-inner"></div>
      </aside>

      <div class="asv__body">
        <div class="asv__ref" aria-live="polite"></div>
        <div class="asv__text" id="asv-text"></div>
      </div>

      <!-- Bottom Chapter-only pager -->
      <div id="asv-bottom-pager" class="asv__pager" aria-hidden="true">
        <button id="asv-bprev" class="asv__btn" type="button" title="Previous Chapter">◀ Previous Chapter</button>
        <button id="asv-bnext" class="asv__btn" type="button" title="Next Chapter">Next Chapter ▶</button>
      </div>

      <div class="asv__share" role="region" aria-label="Share">
        <button id="share-fb" class="shbtn" title="Share on Facebook">${shareIcon('facebook')} <span>Facebook</span></button>
        <a id="share-ig" class="shbtn" title="Instagram" href="https://www.instagram.com/living.word.bibles/" target="_blank" rel="noopener">${shareIcon('instagram')} <span>Instagram</span></a>
        <button id="share-x" class="shbtn" title="Share on X">${shareIcon('x')} <span>X</span></button>
        <button id="share-ln" class="shbtn" title="Share on LinkedIn">${shareIcon('linkedin')} <span>LinkedIn</span></button>
        <button id="share-email" class="shbtn" title="Share by Email">${shareIcon('email')} <span>Email</span></button>
        <button id="share-copy" class="shbtn" title="Copy link">${shareIcon('copy')} <span>Copy</span></button>
      </div>

      <!-- COPYRIGHT (per spec) -->
      <div class="asv__foot" role="contentinfo">
        <span>Copyright © 2025 |</span>
        <a href="/" target="_blank" rel="noopener">Living Word Bibles</a>
        <span>| All Rights Reserved</span>
        <div class="asv__ver">LWB Bible Widget v1.2 Alpha</div>
      </div>
    `;
  }

  // ====================== TOC ===========================
  function toggleTOC(){
    const toc = $('#asv-toc');
    const hiddenNow = toc.getAttribute('aria-hidden') !== 'false';
    toc.setAttribute('aria-hidden', hiddenNow ? 'false' : 'true');
    if(hiddenNow && !toc.dataset.ready){ buildTOC().then(()=> toc.dataset.ready='1'); }
  }

  async function buildTOC(){
    const wrap = $('#asv-toc-inner');
    wrap.innerHTML = '';
    BOOKS.forEach(name=>{
      const a = el('a'); a.href = 'javascript:void(0)'; a.textContent = name;
      a.addEventListener('click', ()=>{
        state.passage = { book:name, chapter:1, verse:1 };
        toggleTOC(); render();
      });
      wrap.appendChild(a);
    });
  }

  // ====================== SHARE ==========================
  function shareUrls(ref, bookName, verseText){
    const url = encodeURIComponent(absoluteVerseUrl(ref));
    const refLabel = `${bookName} ${ref.chapter}:${ref.verse}`;
    const text = encodeURIComponent(`The Holy Bible — ${refLabel}: ${verseText}`.replace(/\s+/g,' ').slice(0,250));
    const title = encodeURIComponent(`The Holy Bible — ${refLabel}`);
    return {
      facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
      x:        `https://twitter.com/intent/tweet?url=${url}&text=${text}`,
      linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${url}`,
      email:    `mailto:?subject=${title}&body=${text}%0A%0A${url}`
    };
  }

  function shareIcon(label){
    const map = {
      facebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 22v-9h3l1-4h-4V7a2 2 0 0 1 2-2h2V1h-3a5 5 0 0 0-5 5v3H7v4h3v9h3z"/></svg>',
      instagram:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-1.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>',
      x:        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 2H22l-9.7 11.1L21.4 22h-7l-5.5-6.7L2.6 22H2l8.6-9.8L2 2h7l5 6.1L18.3 2z"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5C4.98 4.9 3.9 5.9 2.5 5.9S0 4.9 0 3.5 1.1 1.5 2.5 1.5 5 2.9 5 3.5zM0 8.98h5V24H0zM8.48 8.98H13v2.05h.07c.63-1.2 2.16-2.47 4.45-2.47 4.76 0 5.64 3.14 5.64 7.23V24h-5v-6.56c0-1.56-.03-3.56-2.17-3.56-2.17 0-2.5 1.7-2.5 3.45V24h-5V8.98z"/></svg>',
      email:    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20v16H2V4zm10 7L3.5 6.5h17L12 11zm0 2l8.5-6.5V20h-17V6.5L12 13z"/></svg>',
      copy:     '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>'
    };
    return map[label] || '';
  }

  async function copyLink(ref){
    const url = absoluteVerseUrl(ref);
    try{ await navigator.clipboard.writeText(url); }catch(_){
      const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
  }

  function showInlineError(msg){
    const box = el('div','asv__error'); box.textContent = msg;
    const body = $('.asv__body') || root; body.prepend(box);
  }

  // ======================== STATE / DATA =========================
  let state = {
    passage: null,
    view: localStorage.getItem('asv_view') || 'verse', // 'verse' | 'chapter'
  };

  const BookMap = { byName:new Map() }; // name -> {name,slug,chapters:{[c]:{verseCount, verses}}}
  const VerseCounts = new Map(); // "Book|Chapter" -> verseCount

  function keyBC(b,c){ return `${b}|${c}`; }

  // ======================== RENDER =========================
  function setView(v){ state.view=v; localStorage.setItem('asv_view', v); updateViewButton(); }
  function updateViewButton(){ $('#asv-view').textContent = (state.view==='verse') ? 'Verse ▾' : 'Chapter ▴'; }

  function populateBookSelect(){
    const sel = $('#asv-select'); if(!sel) return;
    sel.innerHTML = '';
    const addGroup = (label, list)=>{
      const og = document.createElement('optgroup'); og.label = label;
      list.forEach(n=>{
        if(BookMap.byName.has(n)){
          const opt=document.createElement('option');
          opt.value=n; opt.textContent=n;
          og.appendChild(opt);
        }
      });
      sel.appendChild(og);
    };
    addGroup('Old Testament', OT);
    addGroup('New Testament', NT);
  }

  function populateVerseSelect(book, chapter, currentVerse){
    const sel = $('#asv-verse'); if(!sel) return;
    const vc = VerseCounts.get(keyBC(book,chapter)) || 1;
    sel.innerHTML = Array.from({length:vc}, (_,i)=>`<option value="${i+1}"${i+1===currentVerse?' selected':''}>${i+1}</option>`).join('');
    sel.onchange = ()=>{
      state.passage.verse = parseInt(sel.value,10)||1;
      state.view='verse';
      localStorage.setItem('asv_view','verse');
      render();
    };
  }

  function hashToRef(){
    const h = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    // If older format like #Psalms.23.1 appears, convert
    if(!h.length && /^#.+\.\d+\.\d+$/.test(location.hash)){
      const m = location.hash.slice(1).split('.');
      return { book: normalizeBookName(decodeURIComponent(m[0])), chapter:+m[1], verse:+m[2] };
    }
    return (h.length>=3)
      ? { book: normalizeBookName(decodeURIComponent(h[0])), chapter:+h[1], verse:+h[2] }
      : { book:'Genesis', chapter:1, verse:1 };
  }

  function updateShareLinks(ref, bookName, verseText){
    const links = shareUrls(ref, bookName, verseText);
    $('#share-fb').onclick = ()=>window.open(links.facebook, '_blank', 'noopener');
    $('#share-x').onclick = ()=>window.open(links.x, '_blank', 'noopener');
    $('#share-ln').onclick = ()=>window.open(links.linkedin, '_blank', 'noopener');
    $('#share-email').onclick = ()=>{ location.href = links.email; };
    $('#share-copy').onclick = ()=>copyLink(ref);
  }

  async function render(){
    if(!state.passage) state.passage = hashToRef();

    root.innerHTML = appTemplate();

    // Bind controls
    const jumpErr = 'Try formats like “Ps 23”, “Psalm 23:1”, “1 Co 13”, “Song 2:1”.';
    $('#asv-go').addEventListener('click', ()=>{
      const r = parseInput($('#asv-passage').value);
      if(r && BookMap.byName.has(r.book)){
        state.passage = r; render();
      } else { showInlineError(jumpErr); }
    });
    $('#asv-passage').addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const r = parseInput(e.target.value);
        if(r && BookMap.byName.has(r.book)){ state.passage=r; render(); }
        else { showInlineError(jumpErr); }
      }
    });

    $('#asv-books').addEventListener('click', toggleTOC);
    $('#asv-view').addEventListener('click', ()=>{ setView((state.view==='verse')?'chapter':'verse'); render(); });

    // Build selects
    populateBookSelect();
    const bookSel = $('#asv-select');
    if(!BookMap.byName.has(state.passage.book)){
      state.passage.book = BOOKS.find(b=>BookMap.byName.has(b)) || 'Genesis';
      state.passage.chapter = 1; state.passage.verse = 1;
    }
    bookSel.value = state.passage.book;
    bookSel.onchange = (e)=>{ state.passage = { book:e.target.value, chapter:1, verse:1 }; render(); };

    // Ensure chapter exists
    const exists = VerseCounts.has(keyBC(state.passage.book, state.passage.chapter));
    if(!exists){
      const chs = Object.keys(BookMap.byName.get(state.passage.book).chapters).map(Number);
      const firstCh = Math.min(...chs);
      state.passage.chapter = firstCh; state.passage.verse=1;
    }

    populateVerseSelect(state.passage.book, state.passage.chapter, state.passage.verse);

    // Render text
    const book = BookMap.byName.get(state.passage.book);
    const ch = book.chapters[state.passage.chapter];
    const verseCount = ch?.verseCount || 1;

    const verseText = (state.view==='chapter')
      ? Object.entries(ch.verses).map(([i,t])=>`<span class="vnum">${i}</span> ${escapeHtml(t)}`).join(' ')
      : escapeHtml(ch.verses[String(clamp(state.passage.verse,1,verseCount))]||'(Verse not found.)');

    $('.asv__ref').textContent = `${book.name} ${state.passage.chapter}:${state.passage.verse}`;
    $('#asv-text').innerHTML = (state.view==='chapter') ? verseText : `<span class="verse">${verseText}</span>`;

    updateViewButton();
    updateShareLinks(state.passage, book.name, $('.verse')?.textContent || '');

    // Hash & arrows
    const newHash = refToHash(state.passage); if(location.hash !== newHash) history.replaceState(null, '', newHash);

    const doPrevChapter = ()=>{ state.passage = stepChapter(state.passage, -1); render(); };
    const doNextChapter = ()=>{ state.passage = stepChapter(state.passage, 1); render(); };

    // Top buttons = chapter-only, clamped to same book
    $('#asv-prev').addEventListener('click', doPrevChapter);
    $('#asv-next').addEventListener('click', doNextChapter);

    // Bottom pager visible only in Chapter view
    const pager = $('#asv-bottom-pager');
    const showPager = state.view === 'chapter';
    pager.setAttribute('aria-hidden', showPager ? 'false' : 'true');
    $('#asv-bprev').onclick = ()=>{ state.passage = stepChapter(state.passage, -1); render(); scrollToReaderTop(); };
    $('#asv-bnext').onclick = ()=>{ state.passage = stepChapter(state.passage, 1); render(); scrollToReaderTop(); };

    // Dice — always switches to Verse view
    $('#asv-dice').addEventListener('click', ()=>{
      const names = BOOKS.filter(n=>BookMap.byName.has(n));
      const name = names[Math.floor(Math.random()*names.length)];
      const b = BookMap.byName.get(name);
      const chNums = Object.keys(b.chapters).map(Number);
      const chn = chNums[Math.floor(Math.random()*chNums.length)];
      const vc = b.chapters[chn].verseCount || 1;
      const vs = 1 + Math.floor(Math.random()*vc);
      state.view='verse'; localStorage.setItem('asv_view','verse');
      state.passage = { book:name, chapter:chn, verse:vs };
      render();
    });

    // Keyboard arrows: chapter-only
    window.onkeydown = (e)=>{ if(e.key==='ArrowLeft') doPrevChapter(); if(e.key==='ArrowRight') doNextChapter(); };
  }

  // ====================== NAV HELPERS (chapter-only, clamped) ======================
  function stepChapter(ref, delta){
    const book = ref.book;
    const chNums = Object.keys(BookMap.byName.get(book).chapters).map(Number).sort((a,b)=>a-b);
    const i = chNums.indexOf(ref.chapter);
    if(i<0) return { book, chapter:chNums[0], verse:1 };
    let j = i + (delta<0 ? -1 : 1);
    if(j < 0) j = 0;                             // clamp at first chapter
    if(j > chNums.length-1) j = chNums.length-1; // clamp at last chapter
    return { book, chapter: chNums[j], verse: 1 };
  }

  // ======================== STARTUP ==========================
  (async function start(){
    document.title = 'The Holy Bible: American Standard Version';
    root.innerHTML = '<div style="padding:1rem;color:#666">Loading ASV…</div>';
    try{
      let raw=null, lastErr=null;
      for(const u of DATA_URLS){ try{ raw = await fetchJSON(u); if(raw){ break; } } catch(e){ lastErr=e; } }
      if(!raw) throw lastErr || new Error('ASV data not found.');

      const rows = flattenBibleJSON(raw);
      const map = buildBookMap(rows);
      BookMap.byName = map;

      // Build VerseCounts for quick select population
      for(const [name, b] of map.entries()){
        for(const ch of Object.keys(b.chapters)){
          VerseCounts.set(keyBC(name,Number(ch)), b.chapters[ch].verseCount || 1);
        }
      }

      await render();
    }catch(e){
      root.innerHTML = `<div class="asv__error"><strong>Startup error:</strong> ${escapeHtml(e.message||String(e))}</div>`;
      console.error(e);
    }
  })();

  // Optional: expose for debugging
  window.__ASV__ = { BookMap };
})();
</script>
