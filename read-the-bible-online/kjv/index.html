<script>
(function(){
  const root=document.getElementById('lwb-kjv-app');
  if(!root)return;
  const $=(sel,r=root)=>r.querySelector(sel);
  const escapeHtml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const slugify=name=>String(name).trim().toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'-');
  const fileFromName=name=>String(name).replace(/[^0-9A-Za-z]/g,'')+'.json';
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const LOGO_URL='/assets/LivingWordBibles01.png';
  const BASES=[
    'https://cdn.jsdelivr.net/gh/Living-Word-Bibles/the-holy-bible@main/Bible-kjv-master/',
    'https://raw.githubusercontent.com/Living-Word-Bibles/the-holy-bible/main/Bible-kjv-master/',
    'https://cdn.jsdelivr.net/gh/aruljohn/Bible-kjv@master/',
    'https://raw.githubusercontent.com/aruljohn/Bible-kjv/master/'
  ];
  const OT=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi'];
  const NT=['Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation'];
  const Index={list:null};const Books=new Map();let activeBase='';

  async function fetchJSON(url){const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status+' @ '+url);const text=await res.text();return JSON.parse(text)}
  async function pickBase(){if(activeBase)return activeBase;let last='';for(const base of BASES){try{const names=await fetchJSON(base+'Books.json');if(Array.isArray(names)&&names.length){activeBase=base;return base}}catch(e){last=e.message}}throw new Error('Could not load the KJV book index. '+last)}
  async function loadIndex(){if(Index.list)return Index.list;const base=await pickBase();const names=await fetchJSON(base+'Books.json');Index.list=names.map(name=>({name,slug:slugify(name),url:base+fileFromName(name)}));return Index.list}
  function normalizeBook(name,data){
    const out={name,chapters:{}};
    const add=(chapter,verses)=>{const map={};if(Array.isArray(verses)){verses.forEach((v,i)=>{if(v&&typeof v==='object')map[String(v.verse??v.num??v.v??i+1)]=String(v.text??v.t??'');else map[String(i+1)]=String(v??'')})}else if(verses&&typeof verses==='object'){for(const [k,v] of Object.entries(verses))map[String(k)]=String(v??'')}out.chapters[Number(chapter)]={verseCount:Object.keys(map).length,verses:map}};
    if(data&&Array.isArray(data.chapters)){data.chapters.forEach(ch=>add(ch.chapter,ch.verses||{}));return out}
    if(data&&data.chapters&&typeof data.chapters==='object'){for(const [ch,v] of Object.entries(data.chapters))add(ch,v);return out}
    if(Array.isArray(data)&&Array.isArray(data[0])){data.forEach((v,i)=>add(i+1,v));return out}
    throw new Error('Unrecognized KJV book data format for '+name)
  }
  async function loadBook(slug){if(Books.has(slug))return Books.get(slug);const idx=await loadIndex();const row=idx.find(x=>x.slug===slug);if(!row)throw new Error('Book not found: '+slug);const norm=normalizeBook(row.name,await fetchJSON(row.url));Books.set(slug,norm);return norm}
  const refToHash=ref=>`#/${ref.bookSlug}/${ref.chapter}/${ref.verse}`;
  const absoluteUrl=ref=>location.origin+location.pathname+refToHash(ref);
  function parseInput(input,index){const m=String(input||'').trim().match(/^(\d?\s*[A-Za-z][A-Za-z\s]+?)\s+(\d+)(?::(\d+))?$/);if(!m)return null;const slug=slugify(m[1].replace(/\s+/g,' ').trim());return index.some(x=>x.slug===slug)?{bookSlug:slug,chapter:+m[2],verse:m[3]?+m[3]:1}:null}
  function hashToRef(){const raw=location.hash||'';const parts=raw.replace(/^#\/?/,'').split('/').filter(Boolean);if(parts.length>=3)return{bookSlug:parts[0],chapter:+parts[1],verse:+parts[2]};const m=raw.match(/^#ref=(.+)$/i);if(m){try{return parseInput(decodeURIComponent(m[1]),Index.list||[])||{bookSlug:'genesis',chapter:1,verse:1}}catch(_){}}return{bookSlug:'genesis',chapter:1,verse:1}}
  function nextBookSlug(slug){const i=Index.list.findIndex(x=>x.slug===slug);return i>=0&&i<Index.list.length-1?Index.list[i+1].slug:slug}
  function prevBookSlug(slug){const i=Index.list.findIndex(x=>x.slug===slug);return i>0?Index.list[i-1].slug:slug}
  async function nextVerse(ref){const b=await loadBook(ref.bookSlug),ch=b.chapters[ref.chapter];if(ch&&ref.verse<ch.verseCount)return{...ref,verse:ref.verse+1};const nums=Object.keys(b.chapters).map(Number).sort((a,b)=>a-b),i=nums.indexOf(ref.chapter);if(i<nums.length-1)return{bookSlug:ref.bookSlug,chapter:nums[i+1],verse:1};const s=nextBookSlug(ref.bookSlug),nb=await loadBook(s);return{bookSlug:s,chapter:Math.min(...Object.keys(nb.chapters).map(Number)),verse:1}}
  async function prevVerse(ref){if(ref.verse>1)return{...ref,verse:ref.verse-1};const b=await loadBook(ref.bookSlug),nums=Object.keys(b.chapters).map(Number).sort((a,b)=>a-b),i=nums.indexOf(ref.chapter);if(i>0){const c=nums[i-1];return{bookSlug:ref.bookSlug,chapter:c,verse:b.chapters[c].verseCount||1}}const s=prevBookSlug(ref.bookSlug),pb=await loadBook(s),c=Math.max(...Object.keys(pb.chapters).map(Number));return{bookSlug:s,chapter:c,verse:pb.chapters[c].verseCount||1}}
  async function nextChapter(ref){const b=await loadBook(ref.bookSlug),nums=Object.keys(b.chapters).map(Number).sort((a,b)=>a-b),i=nums.indexOf(ref.chapter);if(i<nums.length-1)return{bookSlug:ref.bookSlug,chapter:nums[i+1],verse:1};const s=nextBookSlug(ref.bookSlug),nb=await loadBook(s);return{bookSlug:s,chapter:Math.min(...Object.keys(nb.chapters).map(Number)),verse:1}}
  async function prevChapter(ref){const b=await loadBook(ref.bookSlug),nums=Object.keys(b.chapters).map(Number).sort((a,b)=>a-b),i=nums.indexOf(ref.chapter);if(i>0)return{bookSlug:ref.bookSlug,chapter:nums[i-1],verse:1};const s=prevBookSlug(ref.bookSlug),pb=await loadBook(s);return{bookSlug:s,chapter:Math.max(...Object.keys(pb.chapters).map(Number)),verse:1}}
  function shareIcon(name){const m={facebook:'<svg viewBox="0 0 24 24"><path d="M13 22v-9h3l1-4h-4V7a2 2 0 0 1 2-2h2V1h-3a5 5 0 0 0-5 5v3H7v4h3v9h3z"/></svg>',instagram:'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-1.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M18.3 2H22l-9.7 11.1L21.4 22h-7l-5.5-6.7L2.6 22H2l8.6-9.8L2 2h7l5 6.1L18.3 2z"/></svg>',linkedin:'<svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.9 3.9 5.9 2.5 5.9S0 4.9 0 3.5 1.1 1.5 2.5 1.5 5 2.9 5 3.5zM0 8.98h5V24H0zM8.48 8.98H13v2.05h.07c.63-1.2 2.16-2.47 4.45-2.47 4.76 0 5.64 3.14 5.64 7.23V24h-5v-6.56c0-1.56-.03-3.56-2.17-3.56-2.17 0-2.5 1.7-2.5 3.45V24h-5V8.98z"/></svg>',email:'<svg viewBox="0 0 24 24"><path d="M2 4h20v16H2V4zm10 7L3.5 6.5h17L12 11zm0 2l8.5-6.5V20h-17V6.5L12 13z"/></svg>',copy:'<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>'};return m[name]||''}
  function template(){return `<div class="kjv__head"><div class="kjv__brand"><img class="kjv__logo" alt="Living Word Bibles" src="${LOGO_URL}"><div class="kjv__title">The Holy Bible</div><div class="kjv__subtitle">King James Version</div></div><div class="kjv__controls"><label class="sr-only" for="kjv-passage">Passage</label><input id="kjv-passage" class="kjv__input" type="text" placeholder="e.g., John 3:16"><button id="kjv-go" class="kjv__btn" type="button">Go</button><select id="kjv-verse" class="kjv__select-verse" aria-label="Select verse"></select><select id="kjv-select" class="kjv__select" aria-label="Select book"></select><button id="kjv-prev" class="kjv__btn" type="button" title="Previous">◀</button><button id="kjv-next" class="kjv__btn" type="button" title="Next">▶</button><button id="kjv-dice" class="kjv__btn kjv__dice" type="button" title="Random verse"><span class="pip pip-1"></span><span class="pip pip-2"></span><span class="pip pip-3"></span><span class="pip pip-4"></span><span class="pip pip-5"></span><span class="pip pip-6"></span></button><div class="kjv__sep"></div><button id="kjv-view" class="kjv__btn" type="button">Verse ▾</button><button id="kjv-a-plus" class="kjv__btn" type="button">A+</button><button id="kjv-a-minus" class="kjv__btn" type="button">A−</button><div class="kjv__sep"></div><button id="kjv-books" class="kjv__btn" type="button">Books</button></div></div><aside id="kjv-toc" class="kjv__toc" aria-hidden="true"><div class="kjv__toc-title">Books</div><div id="kjv-toc-inner" class="kjv__toc-inner"></div></aside><div class="kjv__body"><div class="kjv__ref" aria-live="polite"></div><div class="kjv__text" id="kjv-text"></div></div><div id="kjv-bottom-pager" class="kjv__pager" aria-hidden="true"><button id="kjv-bottom-prev" class="kjv__btn" type="button">◀ Prev Chapter</button><button id="kjv-bottom-next" class="kjv__btn" type="button">Next Chapter ▶</button></div><div class="kjv__share"><button id="share-fb" class="shbtn">${shareIcon('facebook')}<span>Facebook</span></button><a class="shbtn" href="https://www.instagram.com/living.word.bibles/" target="_blank" rel="noopener">${shareIcon('instagram')}<span>Instagram</span></a><button id="share-x" class="shbtn">${shareIcon('x')}<span>X</span></button><button id="share-ln" class="shbtn">${shareIcon('linkedin')}<span>LinkedIn</span></button><button id="share-email" class="shbtn">${shareIcon('email')}<span>Email</span></button><button id="share-copy" class="shbtn">${shareIcon('copy')}<span>Copy</span></button></div><div class="kjv__foot"><div>Copyright © 2000–${new Date().getFullYear()} | <a href="/">Living Word Bibles</a> | All Rights Reserved</div><div class="kjv__foot-right">KJV Bible Widget v1.2 Alpha</div></div>`}
  let state={passage:null,view:localStorage.getItem('kjv_view')||'verse',font:parseFloat(localStorage.getItem('kjv_font')||'1.18')};
  function scrollTop(){requestAnimationFrame(()=>{try{root.scrollIntoView({behavior:'smooth',block:'start'})}catch(_){root.scrollIntoView()}})}
  function setFont(v){state.font=Math.max(.9,Math.min(1.6,v));localStorage.setItem('kjv_font',String(state.font));const t=$('#kjv-text');if(t)t.style.fontSize=state.font+'rem'}
  function populateBooks(idx){const s=$('#kjv-select');s.innerHTML='';for(const [label,list] of [['Old Testament',OT],['New Testament',NT]]){const g=document.createElement('optgroup');g.label=label;for(const name of list){const row=idx.find(x=>x.name===name);if(row){const o=document.createElement('option');o.value=row.slug;o.textContent=row.name;g.appendChild(o)}}s.appendChild(g)}}
  function populateVerses(book){const s=$('#kjv-verse'),count=book.chapters[state.passage.chapter]?.verseCount||1;s.innerHTML=Array.from({length:count},(_,i)=>`<option value="${i+1}"${i+1===state.passage.verse?' selected':''}>${i+1}</option>`).join('');s.onchange=()=>{state.passage.verse=+s.value;state.view='verse';localStorage.setItem('kjv_view','verse');render()}}
  async function buildToc(){const wrap=$('#kjv-toc-inner');wrap.innerHTML='';for(const row of await loadIndex()){const a=document.createElement('a');a.href='#';a.textContent=row.name;a.onclick=async e=>{e.preventDefault();const b=await loadBook(row.slug);state.passage={bookSlug:row.slug,chapter:Math.min(...Object.keys(b.chapters).map(Number)),verse:1};$('#kjv-toc').setAttribute('aria-hidden','true');render()};wrap.appendChild(a)}}
  async function copyLink(){const url=absoluteUrl(state.passage);try{await navigator.clipboard.writeText(url);const span=$('#share-copy span');span.textContent='Copied';setTimeout(()=>span.textContent='Copy',1200)}catch(_){window.prompt('Copy this Bible verse link:',url)}}
  function setShare(book,text){const url=encodeURIComponent(absoluteUrl(state.passage)),label=`${book.name} ${state.passage.chapter}:${state.passage.verse}`,share=encodeURIComponent(`The Holy Bible — ${label}: ${text}`.replace(/\s+/g,' ').slice(0,250));$('#share-fb').onclick=()=>window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`,'_blank','noopener');$('#share-x').onclick=()=>window.open(`https://twitter.com/intent/tweet?url=${url}&text=${share}`,'_blank','noopener');$('#share-ln').onclick=()=>window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${url}`,'_blank','noopener');$('#share-email').onclick=()=>location.href=`mailto:?subject=${encodeURIComponent('The Holy Bible — '+label)}&body=${share}%0A%0A${url}`;$('#share-copy').onclick=copyLink}
  async function render(){
    const idx=await loadIndex();if(!state.passage)state.passage=hashToRef();let row=idx.find(x=>x.slug===state.passage.bookSlug)||idx[0],book=await loadBook(row.slug);if(!book.chapters[state.passage.chapter])state.passage={bookSlug:row.slug,chapter:Math.min(...Object.keys(book.chapters).map(Number)),verse:1};root.innerHTML=template();populateBooks(idx);$('#kjv-select').value=state.passage.bookSlug;$('#kjv-select').onchange=e=>{state.passage={bookSlug:e.target.value,chapter:1,verse:1};render()};populateVerses(book);const ch=book.chapters[state.passage.chapter],verse=clamp(state.passage.verse,1,ch.verseCount||1);state.passage.verse=verse;const plain=ch.verses[String(verse)]||'(Verse not found.)';$('.kjv__ref').textContent=`${book.name} ${state.passage.chapter}:${verse}`;$('#kjv-text').innerHTML=state.view==='chapter'?Object.entries(ch.verses).map(([v,t])=>`<span class="vnum">${v}</span> ${escapeHtml(t)}`).join(' '):`<span class="verse">${escapeHtml(plain)}</span>`;$('#kjv-view').textContent=state.view==='verse'?'Verse ▾':'Chapter ▴';setFont(state.font);
    $('#kjv-go').onclick=()=>{const r=parseInput($('#kjv-passage').value,idx);if(r){state.passage=r;render();scrollTop()}};$('#kjv-passage').onkeydown=e=>{if(e.key==='Enter')$('#kjv-go').click()};
    const goPrev=async()=>{state.passage=state.view==='chapter'?await prevChapter(state.passage):await prevVerse(state.passage);await render();scrollTop()},goNext=async()=>{state.passage=state.view==='chapter'?await nextChapter(state.passage):await nextVerse(state.passage);await render();scrollTop()};$('#kjv-prev').onclick=goPrev;$('#kjv-next').onclick=goNext;
    $('#kjv-dice').onclick=async()=>{const r=idx[Math.floor(Math.random()*idx.length)],b=await loadBook(r.slug),cs=Object.keys(b.chapters).map(Number),c=cs[Math.floor(Math.random()*cs.length)],v=1+Math.floor(Math.random()*(b.chapters[c].verseCount||1));state.passage={bookSlug:r.slug,chapter:c,verse:v};render();scrollTop()};
    $('#kjv-view').onclick=()=>{state.view=state.view==='verse'?'chapter':'verse';localStorage.setItem('kjv_view',state.view);render();scrollTop()};$('#kjv-a-plus').onclick=()=>setFont(state.font+.06);$('#kjv-a-minus').onclick=()=>setFont(state.font-.06);$('#kjv-books').onclick=()=>{const toc=$('#kjv-toc'),open=toc.getAttribute('aria-hidden')!=='false';toc.setAttribute('aria-hidden',open?'false':'true');if(open&&!toc.dataset.ready)buildToc().then(()=>toc.dataset.ready='1')};
    const pager=$('#kjv-bottom-pager');pager.setAttribute('aria-hidden',state.view==='chapter'?'false':'true');$('#kjv-bottom-prev').onclick=async()=>{state.passage=await prevChapter(state.passage);await render();scrollTop()};$('#kjv-bottom-next').onclick=async()=>{state.passage=await nextChapter(state.passage);await render();scrollTop()};
    setShare(book,plain);const hash=refToHash(state.passage);if(location.hash!==hash)history.replaceState(null,'',hash);window.onkeydown=e=>{if(e.key==='ArrowLeft')goPrev();if(e.key==='ArrowRight')goNext()}
  }
  (async()=>{root.innerHTML='<div style="padding:1rem;color:#666">Loading KJV…</div>';try{await loadIndex();await render()}catch(e){root.innerHTML=`<div class="kjv__error"><strong>Startup error:</strong> ${escapeHtml(e.message)}</div>`;console.error(e)}})();
})();
</script>
